    return 'PAUSED';
  }

  function gainCharges(side, slotIdx, amount){
    var p = state.players[side];
    var u = p.units[slotIdx];
    if (!u) return;
    u.charges = (u.charges || 0) + amount;
    p.units.forEach(function(par, i){
      if (par && par.alive && par.card.key === 'parasite' && par.hostSlot === slotIdx) par.charges = (par.charges || 0) + amount;
    });
    if (u.equip && u.equip.card.key === 'battery') u.equip.storedCharges = Math.min(3, (u.equip.storedCharges || 0) + amount);
  }

  // ---------- Death handling ----------
  function destroyUnit(side, idx, opts){
    opts = opts || {};
    var p = state.players[side];
    var u = p.units[idx];
    if (!u) return;
    var card = u.card;

    if (u.equip && u.equip.card.key === 'deathless'){
      p.grave.push(u.equip.card);
      u.equip = null;
      addLog(p.name + "'s Deathless shatters, saving " + card.name + '.', 'trap');
      return;
    }
    if (u.equip && u.equip.card.key === 'inheritance'){
      var heirIdx = findOtherLivingUnit(p, idx);
      if (heirIdx !== -1){
        p.units[heirIdx].equip = u.equip;
        addLog(u.equip.card.name + ' passes on to ' + p.units[heirIdx].card.name + '.', 'meta');
      } else {
        p.grave.push(u.equip.card);
      }
      u.equip = null;
    }
    if (u.equip && u.equip.card.key === 'deadmanswitch'){
      var dmsCard = u.equip.card;
      u.equip = null;
      forcePerformAction(side, idx, u, state.tick);
      p.grave.push(dmsCard);
    }
    if (u.equip && u.equip.card.key === 'battery'){
      var stored = u.equip.storedCharges || 0;
      var batCard = u.equip.card;
      u.equip = null;
      if (stored > 0){
        var otherIdx = findOtherLivingUnit(p, idx);
        if (otherIdx !== -1) p.units[otherIdx].charges = (p.units[otherIdx].charges || 0) + stored;
      }
      p.grave.push(batCard);
    }
    if (u.equip){
      var eqCard = u.equip.card;
      u.equip = null;
      var scav = findLivingScavengerNoEquip(side);
      if (scav){
        state.players[scav.side].units[scav.idx].equip = { card: eqCard, storedCharges: 0 };
        addLog(state.players[scav.side].name + "'s Scavenger claims " + eqCard.name + '.', 'meta');
      } else {
        p.grave.push(eqCard);
      }
    }

    p.grave.push(card);
    p.units[idx] = null;

    p.units.forEach(function(uu){ if (uu && uu.alive && uu.card.key === 'undertaker') uu.charges = (uu.charges || 0) + 1; });
    p.continuous.forEach(function(cc){ if (cc && cc.card.key === 'blackbox') cc.charges = (cc.charges || 0) + 1; });
    p.units.forEach(function(uu){ if (uu && uu.alive && uu.card.key === 'parasite' && uu.hostSlot === idx) uu.hostSlot = null; });

    if (card.key === 'predator'){
      addLog(p.name + "'s Predator lashes out as it dies, hitting its own side for " + PREDATOR_DEATH_AOE + '.', 'attack');
      p.units.forEach(function(uu, i){
        if (!uu || !uu.alive) return;
        uu.hp -= PREDATOR_DEATH_AOE;
        addLog(p.name + "'s " + uu.card.name + ' takes ' + PREDATOR_DEATH_AOE + ' from the death throes.', 'attack');
        if (uu.hp <= 0) destroyUnit(side, i, {});
      });
    }
  }

  function forcePerformAction(side, idx, u, t){
    var card = u.card;
    var selfPlayer = state.players[side];
    if (card.unitType === 'attacker'){
      var power = card.power;
      if (u.equip && u.equip.card.key === 'veteranstandard') power += selfPlayer.summonCount;
      resolveAttackHit(side, 1 - side, power, selfPlayer.name + "'s " + card.name + " (Dead Man's Switch)", t);
    } else if (card.unitType === 'healer'){
      var best = findHealTarget(selfPlayer);
      if (best) applyHeal(selfPlayer, best, card.heal, selfPlayer.name + "'s " + card.name + " (Dead Man's Switch)", t);
    } else if (card.key === 'gravedigger'){
      var graveCount = selfPlayer.grave.length;
      for (var k = 0; k < graveCount; k++) resolveAttackHit(side, 1 - side, 4, selfPlayer.name + "'s Gravedigger (Dead Man's Switch)", t);
    } else if (card.key === 'loadedgun'){
      resolveAttackHit(side, 1 - side, 2, selfPlayer.name + "'s Loaded Gun (Dead Man's Switch)", t);
    }
    // mimic/undertaker/parasite/extortionist/bodyguard/scavenger have no meaningful forced retaliation — skipped.
  }

  // ---------- Heal helpers ----------
  function findHealTarget(player){
    var best = null, bestPct = 1;
    player.structures.forEach(function(s, idx){
      if (s.alive && s.hp < s.maxHp){
        var pct = s.hp / s.maxHp;
        if (pct < bestPct){ bestPct = pct; best = { kind: 'structure', idx: idx }; }
      }
    });
    player.units.forEach(function(u, idx){
      if (u && u.alive && u.hp < u.maxHp){
        var pct = u.hp / u.maxHp;
        if (pct < bestPct){ bestPct = pct; best = { kind: 'unit', idx: idx }; }
      }
    });
    return best;
  }
  function applyHeal(player, best, amount, label, t){
    if (best.kind === 'structure'){
      var s = player.structures[best.idx];
      var before = s.hp;
      s.hp = Math.min(s.maxHp, s.hp + amount);
      addLog('t' + t + ': ' + label + ' repairs Structure ' + (best.idx + 1) + ' for ' + (s.hp - before) + '.', 'heal');
    } else {
      var u = player.units[best.idx];
      var before2 = u.hp;
      u.hp = Math.min(u.maxHp, u.hp + amount);
      addLog('t' + t + ': ' + label + ' heals ' + u.card.name + ' for ' + (u.hp - before2) + '.', 'heal');
    }
  }

  // ---------- Attack resolution pipeline ----------
  function pickAttackTarget(dp){
    for (var i = 0; i < dp.units.length; i++){ if (dp.units[i] && dp.units[i].alive) return { kind: 'unit', idx: i }; }
    for (var j = 0; j < dp.structures.length; j++){ if (dp.structures[j].alive) return { kind: 'structure', idx: j }; }
    return null;
  }

  // attackerIdx: slot of the attacking unit, when there is one (Black Box replays and dying units pass none).
  function resolveAttackHit(attackerSide, defSide, power, sourceLabel, t, attackerIdx){
    var dp = state.players[defSide];
    var target = pickAttackTarget(dp);
    if (!target) return undefined;
    var trapResult = triggerArmedTrap(defSide, attackerSide, power, target.kind, target.idx, t, attackerIdx);
    if (trapResult === 'PAUSED') return 'PAUSED';
    if (trapResult === true) return undefined;
    var bgSlot = findLivingBodyguardSlot(dp);
    if (bgSlot !== -1 && !(target.kind === 'unit' && target.idx === bgSlot)){
      var originalTarget = target;
      pauseForChoice({
        title: 'Bodyguard',
        message: dp.name + "'s Bodyguard offers to intercept this attack. Redirect it to Bodyguard?",
        options: [
          { label: 'Redirect to Bodyguard', onClick: function(){
              var r = applyDamageToTarget(attackerSide, defSide, 'unit', bgSlot, power, sourceLabel, t);
              if (r !== 'PAUSED') drainQueue();
          }},
          { label: 'Let it land normally', onClick: function(){
              var r = applyDamageToTarget(attackerSide, defSide, originalTarget.kind, originalTarget.idx, power, sourceLabel, t);
              if (r !== 'PAUSED') drainQueue();
          }}
        ]
      });
      return 'PAUSED';
    }
    return applyDamageToTarget(attackerSide, defSide, target.kind, target.idx, power, sourceLabel, t);
  }

  function applyDamageToTarget(attackerSide, defSide, kind, idx, power, sourceLabel, t){
    var dp = state.players[defSide];
    if (kind === 'unit'){
      var target = dp.units[idx];
      if (!target) return undefined;
      target.hp -= power;
      addLog('t' + t + ': ' + sourceLabel + ' hits ' + dp.name + "'s " + target.card.name + ' for ' + power + '.', 'attack');
      if (target.hp <= 0){
        var lwIdx = -1;
        for (var i = 0; i < dp.traps.length; i++){ if (dp.traps[i] && dp.traps[i].card.key === 'lastwill'){ lwIdx = i; break; } }
        if (lwIdx !== -1){
          var dyingName = target.card.name;
          chargeExtortionChoice(defSide, function(){
            pauseForChoice({
              title: "Last Will",
              message: dp.name + "'s " + dyingName + ' has taken lethal damage. Save it at 1 HP, or let it die and draw 2 cards?',
              options: [
                { label: 'Save at 1 HP', onClick: function(){
                    target.hp = 1;
                    addLog(dp.name + "'s Last Will saves " + dyingName + ' at 1 HP.', 'trap');
                    consumeTrap(defSide, lwIdx);
                    drainQueue();
                }},
                { label: 'Let it die, draw 2', onClick: function(){
                    destroyUnit(defSide, idx, { killedByOpponent: true });
                    drawCards(dp, 2);
                    addLog(dp.name + "'s Last Will lets " + dyingName + ' die — 2 cards drawn.', 'trap');
                    consumeTrap(defSide, lwIdx);
                    drainQueue();
                }}
              ]
            });
            return 'PAUSED';
          });
          return 'PAUSED';
        }
        destroyUnit(defSide, idx, { killedByOpponent: true });
      }
      return undefined;
    }
    var s = dp.structures[idx];
    s.hp -= power;
    addLog('t' + t + ': ' + sourceLabel + ' strikes ' + dp.name + "'s Structure " + (idx + 1) + ' for ' + power + '.', 'attack');
    if (s.hp <= 0){
      s.hp = 0; s.alive = false;
      addLog('t' + t + ': ' + dp.name + "'s Structure " + (idx + 1) + ' is destroyed!', 'destroy');
      if (dp.structures.every(function(x){ return !x.alive; })){
        state.phase = 'gameOver';
        state.winner = attackerSide;
        addLog(state.players[attackerSide].name + ' wins! All of ' + dp.name + "'s structures have fallen.", 'win');
      }
    }
    return undefined;
  }

  // ---------- Trap dispatcher (fires when an attack lands) ----------
  function triggerArmedTrap(defSide, attackerSide, power, targetKind, targetIdx, t, attackerIdx){
    var dp = state.players[defSide];
    var TRAP_KEYS = ['mirror', 'donation', 'liquidator', 'mutualdestruction', 'standoff', 'repossess', 'cannibalize'];
    var foundIdx = -1;
    for (var i = 0; i < dp.traps.length; i++){
      var tr = dp.traps[i];
      if (!tr || TRAP_KEYS.indexOf(tr.card.key) === -1) continue;
      if (tr.card.manualFire) continue;              // only ever fired by the player
      if (tr.card.manualArm && !tr.primed) continue; // player hasn't activated it yet
      foundIdx = i; break;
    }
    if (foundIdx === -1) return false;
    var key = dp.traps[foundIdx].card.key;
    var resolveNow = function(){
      switch (key){
        case 'mirror': resolveMirror(defSide, attackerSide, foundIdx, attackerIdx); return true;
        case 'donation': resolveDonation(defSide, attackerSide, foundIdx); return true;
        case 'liquidator': resolveLiquidator(defSide, foundIdx); return true;
        case 'repossess': resolveRepossess(defSide, attackerSide, foundIdx); return true;
        case 'cannibalize': resolveCannibalize(defSide, foundIdx); return true;
        case 'standoff': return resolveStandoff(defSide, attackerSide, foundIdx);
        case 'mutualdestruction': return resolveMutualDestruction(defSide, attackerSide, foundIdx, t);
      }
      return false;
    };
    return chargeExtortionChoice(defSide, resolveNow);
  }

  function resolveMirror(defSide, attackerSide, foundIdx, attackerIdx){
    var dp = state.players[defSide], ap = state.players[attackerSide];
    var attacker = attackerIdx !== undefined ? ap.units[attackerIdx] : null;
    if (attacker && attacker.alive){
      addLog(dp.name + "'s Mirror Wall reflects the attack — " + ap.name + "'s " + attacker.card.name + ' is destroyed!', 'trap');
      destroyUnit(attackerSide, attackerIdx, { killedByOpponent: true });
    } else {
      addLog(dp.name + "'s Mirror Wall negates the attack, but there is no attacking unit to destroy.", 'trap');
    }
    consumeTrap(defSide, foundIdx);
  }

  function resolveDonation(defSide, attackerSide, foundIdx){
    var dp = state.players[defSide], ap = state.players[attackerSide];
    var idx = findWeakestUnit(dp);
    if (idx === -1){ addLog(dp.name + "'s Donation fizzles — no unit to give away.", 'trap'); consumeTrap(defSide, foundIdx); return; }
    var emptyIdx = ap.units.findIndex(function(x){ return !x; });
    if (emptyIdx === -1){
      addLog(dp.name + "'s Donation has nowhere to send " + dp.units[idx].card.name + ' — it is destroyed instead.', 'destroy');
      destroyUnit(defSide, idx, {});
    } else {
      var inst = dp.units[idx];
      dp.units[idx] = null;
      ap.units[emptyIdx] = inst;
      addLog(dp.name + ' donates ' + inst.card.name + ' to ' + ap.name + '.', 'trap');
    }
    consumeTrap(defSide, foundIdx);
  }

  function resolveLiquidator(defSide, foundIdx){
    var dp = state.players[defSide];
    var alive = [];
    dp.units.forEach(function(u, i){ if (u && u.alive) alive.push(i); });
    if (alive.length < 1){ addLog(dp.name + "'s Liquidator fizzles — no unit to sacrifice.", 'trap'); consumeTrap(defSide, foundIdx); return; }
    var unitLabel = function(i){ var u = dp.units[i]; return u.card.name + ' (' + u.hp + '/' + u.maxHp + ' HP)'; };
    pauseForChoice({
      title: 'Liquidator',
      message: dp.name + ', choose a unit to sacrifice.',
      options: alive.map(function(sacIdx){
        return { label: unitLabel(sacIdx), onClick: function(){
          var sac = dp.units[sacIdx];
          var gained = Math.floor(sac.hp / 5);
          var receivers = alive.filter(function(i){ return i !== sacIdx && dp.units[i] && dp.units[i].alive; });
          if (gained <= 0 || receivers.length === 0){
            addLog(dp.name + "'s Liquidator sacrifices " + sac.card.name + ' but it yields no charges.', 'trap');
            destroyUnit(defSide, sacIdx, {});
            consumeTrap(defSide, foundIdx);
            drainQueue();
            return;
          }
          pauseForChoice({
            title: 'Liquidator',
            message: dp.name + ', choose the unit to receive ' + gained + ' charge' + (gained === 1 ? '' : 's') + ' from ' + sac.card.name + '.',
            options: receivers.map(function(recIdx){
              return { label: unitLabel(recIdx), onClick: function(){
                gainCharges(defSide, recIdx, gained);
                addLog(dp.name + "'s Liquidator sacrifices " + sac.card.name + ' for ' + gained + ' charge' + (gained === 1 ? '' : 's') + ', paid to ' + dp.units[recIdx].card.name + '.', 'trap');
                destroyUnit(defSide, sacIdx, {});
                consumeTrap(defSide, foundIdx);
                drainQueue();
              }};
            })
          });
        }};
      })
    });
    return 'PAUSED';
  }

  function resolveRepossess(defSide, attackerSide, foundIdx){
    var dp = state.players[defSide], ap = state.players[attackerSide];
    var idx = -1;
    for (var i = 0; i < ap.units.length; i++){
      if (ap.units[i] && ap.units[i].alive && ap.units[i].originalOwner === defSide){ idx = i; break; }
    }
    if (idx === -1){ addLog(dp.name + "'s Repossess fizzles — nothing of theirs to reclaim.", 'trap'); consumeTrap(defSide, foundIdx); return; }
    var inst = ap.units[idx];
    var emptyIdx = dp.units.findIndex(function(x){ return !x; });
    ap.units[idx] = null;
    if (emptyIdx === -1){
      dp.grave.push(inst.card);
      addLog(dp.name + ' repossesses ' + inst.card.name + ' but has no room for it — it is scrapped.', 'trap');
    } else {
      dp.units[emptyIdx] = inst;
      addLog(dp.name + ' repossesses ' + inst.card.name + '!', 'trap');
    }
    consumeTrap(defSide, foundIdx);
  }

  function resolveCannibalize(defSide, foundIdx){
    var dp = state.players[defSide];
    var alive = [];
    dp.units.forEach(function(u, i){ if (u && u.alive) alive.push(i); });
    if (alive.length < 2){ addLog(dp.name + "'s Cannibalize fizzles — not enough units.", 'trap'); consumeTrap(defSide, foundIdx); return; }
    var unitLabel = function(i){ var u = dp.units[i]; return u.card.name + ' (' + u.hp + '/' + u.maxHp + ' HP)'; };
    pauseForChoice({
      title: 'Cannibalize',
      message: dp.name + ', choose a unit to sacrifice.',
      options: alive.map(function(sacIdx){
        return { label: unitLabel(sacIdx), onClick: function(){
          var receivers = alive.filter(function(i){ return i !== sacIdx && dp.units[i] && dp.units[i].alive; });
          pauseForChoice({
            title: 'Cannibalize',
            message: dp.name + ', choose the unit that receives ' + dp.units[sacIdx].card.name + "'s " + dp.units[sacIdx].hp + ' HP.',
            options: receivers.map(function(recIdx){
              return { label: unitLabel(recIdx), onClick: function(){
                var sac = dp.units[sacIdx], rec = dp.units[recIdx];
                rec.maxHp += sac.hp; rec.hp += sac.hp;
                addLog(dp.name + ' cannibalizes ' + sac.card.name + ' into ' + rec.card.name + ' (+' + sac.hp + ' HP).', 'trap');
                destroyUnit(defSide, sacIdx, {});
                consumeTrap(defSide, foundIdx);
                drainQueue();
              }};
            })
          });
        }};
      })
    });
    return 'PAUSED';
  }

  function bidOptionsFor(player){
    var r = totalCharges(player);
    var presets = [0, 1, 2, 3, 5];
    var set = [];
    presets.forEach(function(v){ if (v <= r && set.indexOf(v) === -1) set.push(v); });
    if (r > 0 && set.indexOf(r) === -1) set.push(r);
    if (set.indexOf(0) === -1) set.unshift(0);
    set.sort(function(a, b){ return a - b; });
    return set;
  }

  function resolveStandoff(defSide, attackerSide, foundIdx){
    var dp = state.players[defSide], ap = state.players[attackerSide];
    var defOpts = bidOptionsFor(dp);
    pauseForChoice({
      title: 'Standoff',
      message: dp.name + ', choose your bid (Charges: ' + totalCharges(dp) + ').',
      options: defOpts.map(function(v){
        return { label: (v === totalCharges(dp) && v > 0) ? ('All (' + v + ')') : String(v), onClick: function(){
          var defBid = v;
          var atkOpts = bidOptionsFor(ap);
          pauseForChoice({
            title: 'Standoff',
            message: ap.name + ', choose your bid (Charges: ' + totalCharges(ap) + ').',
            options: atkOpts.map(function(v2){
              return { label: (v2 === totalCharges(ap) && v2 > 0) ? ('All (' + v2 + ')') : String(v2), onClick: function(){
                var atkBid = v2;
                spendCharges(dp, defBid);
                spendCharges(ap, atkBid);
                if (defBid > atkBid){ drawCards(dp, 2); addLog(dp.name + ' wins the Standoff (' + defBid + ' vs ' + atkBid + ') and draws 2 cards.', 'trap'); }
                else if (atkBid > defBid){ drawCards(ap, 2); addLog(ap.name + ' wins the Standoff (' + atkBid + ' vs ' + defBid + ') and draws 2 cards.', 'trap'); }
                else { addLog('The Standoff ends in a tie (' + defBid + ' vs ' + atkBid + '). Neither side draws.', 'trap'); }
                consumeTrap(defSide, foundIdx);
                drainQueue();
              }};
            })
          });
        }};
      })
    });
    return 'PAUSED';
  }

  function resolveMutualDestruction(defSide, attackerSide, foundIdx, t){
    var dp = state.players[defSide], ap = state.players[attackerSide];
    var dpIdxs = []; dp.units.forEach(function(u, i){ if (u && u.alive) dpIdxs.push(i); });
    var apIdxs = []; ap.units.forEach(function(u, i){ if (u && u.alive) apIdxs.push(i); });
    if (!dpIdxs.length || !apIdxs.length){
      addLog(dp.name + "'s Mutual Destruction fizzles — not enough units on the field.", 'trap');
      consumeTrap(defSide, foundIdx);
      return true;
    }
    pauseForChoice({
      title: 'Mutual Destruction',
      message: dp.name + ', choose one of your units to swap into combat.',
      options: dpIdxs.map(function(i){
        return { label: dp.units[i].card.name + ' (slot ' + (i + 1) + ')', onClick: function(){
          var dpPick = i;
          pauseForChoice({
            title: 'Mutual Destruction',
            message: ap.name + ', choose one of your units to swap into combat.',
            options: apIdxs.map(function(j){
              return { label: ap.units[j].card.name + ' (slot ' + (j + 1) + ')', onClick: function(){
                var apPick = j;
                var tmp = dp.units[dpPick];
                dp.units[dpPick] = ap.units[apPick];
                ap.units[apPick] = tmp;
                addLog(dp.name + ' and ' + ap.name + ' swap ' + dp.units[dpPick].card.name + ' and ' + ap.units[apPick].card.name + ' in the chaos!', 'trap');
                consumeTrap(defSide, foundIdx);
                var r1 = performAction(defSide, dpPick, dp.units[dpPick], t);
                if (r1 === 'PAUSED') return;
                var r2 = performAction(attackerSide, apPick, ap.units[apPick], t);
                if (r2 === 'PAUSED') return;
                drainQueue();
              }};
            })
          });
        }};
      })
    });
    return 'PAUSED';
  }

  // ---------- Hijack (auto-resolve redirect) ----------
  function tryHijack(activatingSide){
    var opp = 1 - activatingSide;
    var op = state.players[opp];
    var hijackIdx = -1;
    for (var i = 0; i < op.traps.length; i++){ if (op.traps[i] && op.traps[i].card.key === 'hijack'){ hijackIdx = i; break; } }
    if (hijackIdx === -1) return null;
    var chargedSlot = -1;
    for (var j = 0; j < op.units.length; j++){ if (op.units[j] && op.units[j].alive && (op.units[j].charges || 0) > 0){ chargedSlot = j; break; } }
    if (chargedSlot === -1) return null;
    chargeExtortion(opp);
    op.units[chargedSlot].charges -= 1;
    consumeTrap(opp, hijackIdx);
    addLog(op.name + "'s Hijack seizes control of the effect!", 'trap');
    return opp;
  }

  function hitOwnWeakest(side, amount, label, t){
    var p = state.players[side];
    var idx = findWeakestUnit(p);
    if (idx === -1){
      var sIdx = p.structures.findIndex(function(s){ return s.alive; });
      if (sIdx === -1) return;
      p.structures[sIdx].hp -= amount;
      addLog('t' + t + ': ' + label + ' backfires onto ' + p.name + "'s Structure " + (sIdx + 1) + ' for ' + amount + '.', 'attack');
      if (p.structures[sIdx].hp <= 0){
        p.structures[sIdx].hp = 0; p.structures[sIdx].alive = false;
        addLog(p.name + "'s Structure " + (sIdx + 1) + ' is destroyed!', 'destroy');
        if (p.structures.every(function(x){ return !x.alive; })){
          state.phase = 'gameOver';
          state.winner = 1 - side;
          addLog(state.players[1 - side].name + ' wins!', 'win');
        }
      }
      return;
    }
    var target = p.units[idx];
    target.hp -= amount;
    addLog('t' + t + ': ' + label + ' backfires onto ' + p.name + "'s " + target.card.name + ' for ' + amount + '.', 'attack');
    if (target.hp <= 0) destroyUnit(side, idx, { killedByOpponent: true });
  }

  // ---------- Per-card unit actions ----------
  function doAttackerAction(side, slotIdx, u, t){
    var card = u.card;
    var selfPlayer = state.players[side];
    var power = card.power;
    if (u.equip && u.equip.card.key === 'veteranstandard') power += selfPlayer.summonCount;
    selfPlayer.lastAction = { kind: 'attack', amount: power };
    return resolveAttackHit(side, 1 - side, power, selfPlayer.name + "'s " + card.name, t, slotIdx);
  }

  // Every scheduled action leaves a log line, even when it has nothing to do.
  function logIdle(side, name, t, reason){
    addLog('t' + t + ': ' + state.players[side].name + "'s " + name + ' takes its turn — ' + reason + '.', 'idle');
  }

  function doHealerAction(side, slotIdx, u, t){
    var card = u.card;
    var selfPlayer = state.players[side];
    var best = findHealTarget(selfPlayer);
    selfPlayer.lastAction = { kind: 'heal', amount: card.heal };
    if (!best){ logIdle(side, card.name, t, 'nothing is wounded'); return; }
    applyHeal(selfPlayer, best, card.heal, selfPlayer.name + "'s " + card.name, t);
  }

  function doGravedigger(side, slotIdx, u, t){
    if (!(u.charges > 0)){ logIdle(side, u.card.name, t, 'no charge to spend'); return; }
    var hijacked = tryHijack(side);
    var selfPlayer = state.players[side];
    var graveCount = selfPlayer.grave.length;
    u.charges = 0;
    addLog('t' + t + ': ' + selfPlayer.name + "'s Gravedigger unleashes " + graveCount + ' strike(s) from the grave!', 'attack');
    for (var k = 0; k < graveCount; k++){
      if (hijacked !== null){ hitOwnWeakest(hijacked, 4, selfPlayer.name + "'s Gravedigger (hijacked)", t); continue; }
      var r = resolveAttackHit(side, 1 - side, 4, selfPlayer.name + "'s Gravedigger", t, slotIdx);
      if (r === 'PAUSED') return 'PAUSED'; // remaining hits in this volley are dropped if one hit opens a choice modal
      if (!u.alive) break;                 // e.g. reflected by Mirror Wall mid-volley
    }
  }

  function doUndertaker(side, slotIdx, u, t){
    if (!(u.charges >= 2)){ logIdle(side, u.card.name, t, 'needs 2 charges, has ' + (u.charges || 0)); return; }
    var hijacked = tryHijack(side);
    var selfPlayer = state.players[side];
    if (hijacked !== null){
      u.charges -= 2;
      addLog('t' + t + ': ' + selfPlayer.name + "'s Undertaker is hijacked — its recall fizzles.", 'trap');
      return;
    }
    var foundIdx = -1;
    for (var i = selfPlayer.grave.length - 1; i >= 0; i--){ if (selfPlayer.grave[i].type === 'unit'){ foundIdx = i; break; } }
    if (foundIdx === -1){ logIdle(side, u.card.name, t, 'no unit in the graveyard to recall'); return; }
    u.charges -= 2;
    var card = selfPlayer.grave.splice(foundIdx, 1)[0];
    selfPlayer.hand.push(card);
    addLog('t' + t + ': ' + selfPlayer.name + "'s Undertaker recalls " + card.name + ' from the grave.', 'heal');
  }

  function doParasite(side, slotIdx, u, t){
    var selfPlayer = state.players[side];
    if (u.hostSlot !== null && u.hostSlot !== undefined){
      var host = selfPlayer.units[u.hostSlot];
      logIdle(side, u.card.name, t, 'stays attached to ' + (host ? host.card.name : 'its host'));
      return;
    }
    for (var i = 0; i < selfPlayer.units.length; i++){
      if (i !== slotIdx && selfPlayer.units[i] && selfPlayer.units[i].alive){
        u.hostSlot = i;
        addLog('t' + t + ': ' + selfPlayer.name + "'s Parasite had no host, so it latches onto " + selfPlayer.units[i].card.name + '.', 'meta');
        return;
      }
    }
    logIdle(side, u.card.name, t, 'no unit to attach to');
  }

  function doLoadedGun(side, slotIdx, u, t){
    if (!(u.charges > 0)){ logIdle(side, u.card.name, t, 'no charge to spend'); return; }
    var hijacked = tryHijack(side);
    u.charges -= 1;
    var selfPlayer = state.players[side];
    var label = selfPlayer.name + "'s Loaded Gun";
    var result;
    addLog('t' + t + ': ' + selfPlayer.name + ' fires Loaded Gun (' + u.charges + ' charge(s) left).', 'meta');
    if (hijacked !== null) hitOwnWeakest(hijacked, 2, label + ' (hijacked)', t);
    else result = resolveAttackHit(side, 1 - side, 2, label, t, slotIdx);
    if (u.charges <= 0) destroyUnit(side, slotIdx, {});
    if (result === 'PAUSED') return 'PAUSED';
  }

  function doMimic(side, slotIdx, u, t){
    if (!(u.charges > 0)){ logIdle(side, u.card.name, t, 'no charge to spend'); return; }
    var hijacked = tryHijack(side);
    var selfPlayer = state.players[side];
    var templateIdx = -1;
    for (var i = 0; i < selfPlayer.units.length; i++){
      if (i !== slotIdx && selfPlayer.units[i] && selfPlayer.units[i].alive){ templateIdx = i; break; }
    }
    if (templateIdx === -1){ logIdle(side, u.card.name, t, 'no unit to copy'); return; }
    u.charges -= 1;
    var template = selfPlayer.units[templateIdx].card;
    var label = selfPlayer.name + "'s Mimic (as " + template.name + ')';
    if (hijacked !== null){
      var amt = template.unitType === 'attacker' ? template.power : (template.heal || 2);
      hitOwnWeakest(hijacked, amt, label + ' (hijacked)', t);
      return;
    }
    if (template.unitType === 'attacker'){
      var power = template.power;
      if (selfPlayer.units[templateIdx].equip && selfPlayer.units[templateIdx].equip.card.key === 'veteranstandard') power += selfPlayer.summonCount;
      var r = resolveAttackHit(side, 1 - side, power, label, t, slotIdx);
      selfPlayer.lastAction = { kind: 'attack', amount: power };
      if (r === 'PAUSED') return 'PAUSED';
    } else if (template.unitType === 'healer'){
      var best = findHealTarget(selfPlayer);
      if (best){ applyHeal(selfPlayer, best, template.heal, label, t); selfPlayer.lastAction = { kind: 'heal', amount: template.heal }; }
      else logIdle(side, label, t, 'nothing is wounded');
    } else {
      // Mimic only copies Striker/Medic-style templates in this prototype, not other specials.
      logIdle(side, label, t, 'cannot copy that kind of unit');
    }
  }

  function doMartyr(side, slotIdx, u, t){
    if (!(u.charges > 0)){ logIdle(side, u.card.name, t, 'no charge to spend'); return; }
    var selfPlayer = state.players[side];
    var targets = [];
    selfPlayer.units.forEach(function(x, i){ if (i !== slotIdx && x && x.alive) targets.push(i); });
    if (targets.length === 0){ logIdle(side, u.card.name, t, 'no unit to receive its charges'); return; }
    var unitLabel = function(i){ var x = selfPlayer.units[i]; return x.card.name + ' (' + x.hp + '/' + x.maxHp + ' HP)'; };
    pauseForChoice({
      title: 'Martyr',
      message: selfPlayer.name + ', choose the unit to receive 2 charges from Martyr.',
      options: targets.map(function(i){
        return { label: unitLabel(i), onClick: function(){
          gainCharges(side, i, 2);
          addLog('t' + t + ': ' + selfPlayer.name + "'s Martyr gives 2 charges to " + selfPlayer.units[i].card.name + ' and destroys itself.', 'meta');
          destroyUnit(side, slotIdx, {});
          drainQueue();
        }};
      })
    });
    return 'PAUSED';
  }

  function resolveBlackBox(side, continuousIdx){
    var p = state.players[side];
    var slot = p.continuous[continuousIdx];
    if (!slot || slot.card.key !== 'blackbox') return;
    if ((slot.charges || 0) < 3) return;
    var resolveNow = function(){
      slot.charges -= 3;
      if (!p.lastAction){ logIdle(side, slot.card.name, state.tick, 'no attack or heal to replay'); return; }
      var label = p.name + "'s Black Box (replay)";
      if (p.lastAction.kind === 'attack'){
        var r = resolveAttackHit(side, 1 - side, p.lastAction.amount, label, state.tick);
        if (r === 'PAUSED') return 'PAUSED';
      } else {
        var best = findHealTarget(p);
        if (best) applyHeal(p, best, p.lastAction.amount, label, state.tick);
      }
    };
    return chargeExtortionChoice(side, resolveNow);
  }

  // ---------- Player-activated abilities ----------
  function canActivate(side, idx){
    if (state.phase !== 'simulating' || state.pendingChoice) return false;
    var u = state.players[side].units[idx];
    return !!(u && u.alive && u.card.activatable && (u.charges || 0) >= (u.card.activateCost || 1));
  }

  function canActivateTrap(side, idx){
    if (state.phase !== 'simulating' || state.pendingChoice) return false;
    var tr = state.players[side].traps[idx];
    if (!tr) return false;
    return !!(tr.card.manualFire || (tr.card.manualArm && !tr.primed));
  }

  function activateTrap(side, idx){
    if (!canActivateTrap(side, idx)) return;
    var tr = state.players[side].traps[idx];
    if (tr.card.manualArm){
      tr.primed = true;
      addLog('t' + state.tick + ': ' + state.players[side].name + ' activates ' + tr.card.name + ' — it will catch the next enemy attack.', 'trap');
      render();
      return;
    }
    // manualFire: resolves immediately
    addLog('t' + state.tick + ': ' + state.players[side].name + ' activates ' + tr.card.name + '.', 'trap');
    state.manualPause = true; // if this opens a choice, resuming should not consume a queued Step
    var resolveNow = function(){
      var result;
      switch (tr.card.key){
        case 'liquidator': result = resolveLiquidator(side, idx); break;
        case 'cannibalize': result = resolveCannibalize(side, idx); break;
        case 'standoff': result = resolveStandoff(side, 1 - side, idx); break;
        case 'donation': resolveDonation(side, 1 - side, idx); break;
        case 'repossess': resolveRepossess(side, 1 - side, idx); break;
      }
      return result;
    };
    var result = chargeExtortionChoice(side, resolveNow);
    if (result !== 'PAUSED'){ state.manualPause = false; render(); }
  }

  function activateUnit(side, idx){
    if (!canActivate(side, idx)) return;
    var u = state.players[side].units[idx];
    var result;
    state.manualPause = true; // if this opens a choice, resuming should not consume a queued Step
    switch (u.card.key){
      case 'loadedgun': result = doLoadedGun(side, idx, u, state.tick); break;
      case 'undertaker': result = doUndertaker(side, idx, u, state.tick); break;
      case 'martyr': result = doMartyr(side, idx, u, state.tick); break;
    }
    if (result !== 'PAUSED') state.manualPause = false;
    render();
  }

  // ---------- Dispatcher ----------
  function performAction(side, slotIdx, u, t){
    var card = u.card;
    switch (card.unitType){
      case 'attacker': return doAttackerAction(side, slotIdx, u, t);
      case 'healer': return doHealerAction(side, slotIdx, u, t);
      case 'special':
        switch (card.key){
          case 'gravedigger': return doGravedigger(side, slotIdx, u, t);
          case 'undertaker': return doUndertaker(side, slotIdx, u, t);
          case 'parasite': return doParasite(side, slotIdx, u, t);
          case 'loadedgun': return doLoadedGun(side, slotIdx, u, t);
          case 'mimic': return doMimic(side, slotIdx, u, t);
          case 'martyr': return doMartyr(side, slotIdx, u, t);
        }
        return;
      default: return;
    }
  }

  function endSimulation(){
    state.phase = 'roundEnd';
    addLog('Round ' + state.round + ' ends.', 'meta');
    render();
  }

  function continueToNextRound(){
    if (state.phase !== 'roundEnd') return;
    state.round++;
    state.players.forEach(function(p){ drawCards(p, DRAW_PER_ROUND); });
    state.phase = 'setup';
    state.tick = 0;
    render();
  }

  // ---------- Setup interactions ----------
  function onHandCardClick(side, idx){
    if (state.phase !== 'setup') return;
    state.attaching = null;
    if (state.selected && state.selected.side === side && state.selected.idx === idx){
      state.selected = null;
    } else {
      state.selected = { side: side, idx: idx };
    }
    render();
  }

  function onSlotClick(side, zone, idx){
    if (state.phase !== 'setup') return;
    var player = state.players[side];
    var sel = state.selected;
    var selCard = (sel && sel.side === side) ? player.hand[sel.idx] : null;

    if (zone === 'unit'){
      var existingUnit = player.units[idx];
      var att = state.attaching;
      if (att && att.side === side){
        // Choosing a host for the Parasite in att.idx.
        if (idx === att.idx){ state.attaching = null; render(); return; }
        if (existingUnit && existingUnit.alive){
          player.units[att.idx].hostSlot = idx;
          state.attaching = null;
          render();
        }
        return;
      }
      if (existingUnit && selCard && selCard.type === 'equip' && !existingUnit.equip){
        player.hand.splice(sel.idx, 1);
        existingUnit.equip = { card: selCard, storedCharges: 0 };
        state.selected = null;
        render();
        return;
      }
      if (existingUnit){
        // Clicking a placed Parasite starts (or restarts) host selection; removal is a double-click.
        if (existingUnit.card.key === 'parasite'){ state.selected = null; state.attaching = { side: side, idx: idx }; render(); }
        return;
      }
      if (selCard && selCard.type === 'unit'){
        player.hand.splice(sel.idx, 1);
        player.units[idx] = { card: selCard, hp: selCard.hp, maxHp: selCard.hp, alive: true, charges: selCard.startCharges || 0, equip: null, originalOwner: side, hostSlot: null };
        player.summonCount += 1;
        state.selected = null;
        if (selCard.key === 'parasite') state.attaching = { side: side, idx: idx }; // go straight to picking a host
        render();
        return;
      }
      return;
    }

    if (zone === 'trap' || zone === 'continuous'){
      state.attaching = null;
      var arr = zone === 'trap' ? player.traps : player.continuous;
      if (arr[idx]) return; // occupied: removal is a double-click (see removePlacedCard)
      if (!selCard) return;
      if (zone === 'trap' && selCard.type !== 'trap') return;
      if (zone === 'continuous' && selCard.type !== 'continuous') return;
      player.hand.splice(sel.idx, 1);
      arr[idx] = zone === 'continuous' ? { card: selCard, charges: 0 } : { card: selCard };
      state.selected = null;
      render();
    }
  }

  // Double-click (or Delete/Backspace) on a placed card during setup returns it to hand.
  function removePlacedCard(side, zone, idx){
    if (state.phase !== 'setup') return;
    var player = state.players[side];
    if (zone === 'unit'){
      var u = player.units[idx];
      if (!u) return;
      if (u.equip) player.hand.push(u.equip.card); // equip comes back to hand with its unit
      player.hand.push(u.card);
      player.units[idx] = null;
      player.units.forEach(function(uu){ if (uu && uu.hostSlot === idx) uu.hostSlot = null; });
    } else {
      var arr = zone === 'trap' ? player.traps : player.continuous;
      if (!arr[idx]) return;
      player.hand.push(arr[idx].card);
      arr[idx] = null;
    }
    state.selected = null;
    state.attaching = null;
    if (state.inspected && state.inspected.loc && state.inspected.loc.side === side && state.inspected.loc.zone === zone && state.inspected.loc.idx === idx) state.inspected = null;
    render();
  }

  function autoPlaceCard(side, handIdx){
    if (state.phase !== 'setup') return;
    var player = state.players[side];
    var card = player.hand[handIdx];
    if (!card) return;
    var zone, targetIdx = -1;
    if (card.type === 'unit'){
      zone = 'unit';
      targetIdx = player.units.findIndex(function(u){ return !u; });
    } else if (card.type === 'trap'){
      zone = 'trap';
      targetIdx = player.traps.findIndex(function(t){ return !t; });
    } else if (card.type === 'continuous'){
      zone = 'continuous';
      targetIdx = player.continuous.findIndex(function(c){ return !c; });
    } else if (card.type === 'equip'){
      zone = 'unit';
      targetIdx = player.units.findIndex(function(u){ return u && u.alive && !u.equip; });
    }
    if (targetIdx === -1){
      // nowhere to auto-place (zone full, or no eligible unit for an equip) — just select it for manual placement
      state.selected = { side: side, idx: handIdx };
      render();
      return;
    }
    state.selected = { side: side, idx: handIdx };
    onSlotClick(side, zone, targetIdx);
  }

  function toggleGrave(side){
    state.graveOpen[side] = !state.graveOpen[side];
    render();
  }

  function resetGame(){
    if (!confirm('Start a brand new game? Current boards and log will be cleared.')) return;
    state = freshState();
    lastHandUids = [new Set(), new Set()];
    render();
  }

  // ---------- Card inspector ----------
  // loc: { side, zone:'hand'|'unit'|'trap'|'continuous'|'grave', idx } or null for a detached card (e.g. an equip badge)
  function inspectCard(card, loc){
    state.inspected = { card: card, loc: loc || null };
    renderInspector();
  }

  function inspectedLiveInfo(){
    var ins = state.inspected;
    if (!ins || !ins.loc) return null;
    var loc = ins.loc, p = state.players[loc.side];
    if (loc.zone === 'unit'){
      var u = p.units[loc.idx];
      if (!u || u.card.uid !== ins.card.uid) return null;
      var parts = ['On ' + p.name + "'s board (slot " + (loc.idx + 1) + ')', 'HP ' + u.hp + '/' + u.maxHp];
      if (ins.card.usesCharges) parts.push('Charges ' + (u.charges || 0));
      if (ins.card.activatable) parts.push('Activate manually during battle');
      else if (isFinite(ins.card.cooldown)){
        parts.push('Acts every ' + ins.card.cooldown + ' ticks');
        if (state.phase === 'simulating' || state.phase === 'roundEnd') parts.push('Next action in ' + (ins.card.cooldown - (state.tick % ins.card.cooldown)) + ' ticks');
      }
      else if (ins.card.unitType === 'passive') parts.push('Passive — never takes a turn');
      if (u.equip){
        var eq = 'Equipped: ' + u.equip.card.name;
        if (u.equip.card.key === 'battery') eq += ' (' + (u.equip.storedCharges || 0) + '/3 stored)';
        parts.push(eq);
      }
      if (u.hostSlot != null && p.units[u.hostSlot]) parts.push('Attached to ' + p.units[u.hostSlot].card.name);
      return parts;
    }
    if (loc.zone === 'trap' || loc.zone === 'continuous'){
      var arr = loc.zone === 'trap' ? p.traps : p.continuous;
      var inst = arr[loc.idx];
      if (!inst || inst.card.uid !== ins.card.uid) return null;
      if (loc.zone === 'continuous') return ['Active on ' + p.name + "'s side", 'Charges ' + (inst.charges || 0) + '/3'];
      if (inst.card.manualArm) return [(inst.primed ? 'Active' : 'Dormant') + ' on ' + p.name + "'s side", inst.primed ? 'Catches the next enemy attack' : 'Activate it during the battle'];
      if (inst.card.manualFire) return ['Ready on ' + p.name + "'s side", 'Activate it during the battle'];
      return ['Armed on ' + p.name + "'s side"];
    }
    if (loc.zone === 'hand'){
      var h = p.hand[loc.idx];
      if (!h || h.uid !== ins.card.uid) return null;
      return ['In ' + p.name + "'s hand"];
    }
    if (loc.zone === 'grave') return ['In ' + p.name + "'s graveyard"];
    return null;
  }

  function cardTypeLabel(card){
    if (card.type === 'trap') return 'Trap · one use';
    if (card.type === 'continuous') return 'Continuous · field';
    if (card.type === 'equip') return 'Equip';
    if (card.unitType === 'attacker') return 'Unit · attacker';
    if (card.unitType === 'healer') return 'Unit · healer';
    if (card.unitType === 'passive') return 'Unit · passive';
    return 'Unit · special';
  }

  function renderInspector(){
    var box = document.getElementById('inspector');
    var body = document.getElementById('inspectorBody');
    var closeBtn = document.getElementById('inspectorClose');
    var ins = state.inspected;
    box.className = 'inspector';
    body.innerHTML = '';
    closeBtn.hidden = !ins;
    if (!ins){
      body.innerHTML = '<div class="inspector-empty">Click any card to see what it does.</div>';
      return;
    }
    var card = ins.card;
    box.className = 'inspector ' + cardColorClass(card);
    var stats = [];
    if (card.power != null) stats.push('PWR ' + card.power);
    if (card.heal != null) stats.push('HEAL ' + card.heal);
    if (card.hp != null) stats.push('HP ' + card.hp);
    if (card.startCharges != null) stats.push('Starts with ' + card.startCharges + ' charge' + (card.startCharges === 1 ? '' : 's'));
    else if (card.usesCharges) stats.push('Uses charges');
    if (isFinite(card.cooldown) && card.type === 'unit') stats.push('Every ' + card.cooldown + ' ticks');
    var html =
      '<div class="inspector-title"><div class="inspector-icon">' + card.icon + '</div>' +
      '<div><div class="inspector-name">' + card.name + '</div><div class="inspector-type">' + cardTypeLabel(card) + '</div></div></div>';
    if (stats.length) html += '<div class="inspector-stats">' + stats.map(function(t){ return '<span class="inspector-stat mono">' + t + '</span>'; }).join('') + '</div>';
    html += '<div class="inspector-effect">' + card.effect + '</div>';
    var live = inspectedLiveInfo();
    if (live) html += '<div class="inspector-live">' + live.join(' · ') + '</div>';
    body.innerHTML = html;
  }

  // ---------- Rendering ----------
  function el(tag, cls, attrs){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function prioBadge(side, zone, idx){
    var n = slotPriority(side, zone, idx);
    return '<div class="prio-badge mono" title="Priority ' + n + ' — lower acts first on ties">' + n + '</div>';
  }

  function cardColorClass(card){
    if (card.type === 'trap' || card.type === 'continuous') return 'ctrap';
    if (card.type === 'equip') return 'cequip';
    if (card.unitType === 'attacker') return 'cattack';
    if (card.unitType === 'healer') return 'cheal';
    return 'cspecial';
  }

  function statLines(card){
    if (card.type === 'equip') return ['EQUIP', ''];
    if (card.type === 'continuous') return ['FIELD', ''];
    if (card.type === 'trap') return ['TRAP', '1-USE'];
    if (card.unitType === 'attacker') return ['PWR ' + card.power, 'HP ' + card.hp];
    if (card.unitType === 'healer') return ['HEAL ' + card.heal, 'HP ' + card.hp];
    if (card.unitType === 'passive') return ['PASSIVE', 'HP ' + card.hp];
    return ['SPECIAL', 'HP ' + card.hp];
  }

  function renderHandCard(side, card, idx){
    var isSelected = state.selected && state.selected.side === side && state.selected.idx === idx;
    var interactive = state.phase === 'setup';
    var cls = 'card ' + card.key + ' ' + cardColorClass(card) + (card.type !== 'unit' ? ' trap-card' : '') +
      (interactive ? ' selectable' : ' dim') + (isSelected ? ' is-selected' : '');
    var c = el('div', cls, { tabindex: interactive ? '0' : '-1', role:'button',
      'aria-pressed': isSelected ? 'true':'false', title: card.name + ' — ' + card.effect });
    var lines = statLines(card);
    c.innerHTML =
      '<div class="icon">' + card.icon + '</div>' +
      '<div class="name">' + card.name + '</div>' +
      '<div class="stat mono">' + lines[0] + '</div>' +
      '<div class="stat mono">' + lines[1] + '</div>';
    c.addEventListener('click', function(){ inspectCard(card, { side: side, zone: 'hand', idx: idx }); if (interactive) onHandCardClick(side, idx); });
    if (interactive){
      c.addEventListener('dblclick', function(e){ e.preventDefault(); autoPlaceCard(side, idx); });
      c.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); inspectCard(card, { side: side, zone: 'hand', idx: idx }); onHandCardClick(side, idx); } });
    }
    return c;
  }

  function renderUnitSlot(side, idx){
    var player = state.players[side];
    var u = player.units[idx];
    var interactive = state.phase === 'setup';
    var selCard = (interactive && state.selected && state.selected.side === side) ? player.hand[state.selected.idx] : null;

    if (!u){
      var validTarget = !!(selCard && selCard.type === 'unit');
      var slot = el('div', 'slot' + (validTarget ? ' valid-target' : ''), { tabindex:'0', role:'button', 'aria-label':'empty unit slot' });
      slot.innerHTML = prioBadge(side, 'unit', idx) + '+';
      slot.addEventListener('click', function(){ onSlotClick(side, 'unit', idx); });
      slot.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onSlotClick(side, 'unit', idx); } });
      return slot;
    }
    var card = u.card;
    var att = (interactive && state.attaching && state.attaching.side === side) ? state.attaching : null;
    var equipTarget = !att && !!(selCard && selCard.type === 'equip' && !u.equip);
    var hostTarget = !!(att && att.idx !== idx && u.alive);
    var isAttaching = !!(att && att.idx === idx);
    var isNext = !!(nextActor && nextActor.side === side && nextActor.idx === idx);
    var c = el('div', 'card placed ' + card.key + ' ' + cardColorClass(card) + (interactive ? ' selectable' : '') + ((equipTarget || hostTarget) ? ' valid-target' : '') + (isAttaching ? ' is-selected' : '') + (isNext ? ' next-actor' : ''),
      { tabindex:'0', role:'button', title: card.name + ' — ' + card.effect + (interactive ? ' (double-click to return to hand)' : '') });
    var pct = Math.max(0, u.hp / u.maxHp);
    var lines;
    if (card.unitType === 'attacker') lines = ['PWR ' + card.power, ''];
    else if (card.unitType === 'healer') lines = ['HEAL ' + card.heal, ''];
    else if (card.unitType === 'passive') lines = ['PASSIVE', ''];
    else lines = ['SPECIAL', ''];
    if (card.key === 'parasite'){
      var host = u.hostSlot != null ? player.units[u.hostSlot] : null;
      lines[0] = host ? ('→ ' + host.card.name) : 'NO HOST';
    }
    var chargePct = (state.phase === 'simulating' || state.phase === 'roundEnd' || state.phase === 'gameOver') && isFinite(card.cooldown)
      ? (state.tick % card.cooldown) / card.cooldown : 0;
    var chargeLine = (card.usesCharges || (u.charges || 0) > 0) ? ('<div class="stat mono">⚡' + (u.charges || 0) + '</div>') : '';
    var activatable = canActivate(side, idx);
    if (activatable) lines[0] = '<button class="activate-btn" type="button" title="Spend ' + (card.activateCost || 1) + ' charge(s) now">' + (card.key === 'undertaker' ? 'Recall' : 'Fire') + '</button>';
    var equipBadge = u.equip ? ('<div class="equip-badge" title="' + u.equip.card.name + ' — ' + u.equip.card.effect + ' (click for details)">' + u.equip.card.icon + '</div>') : '';
    c.innerHTML =
      equipBadge + prioBadge(side, 'unit', idx) +
      (isNext ? '<div class="next-tag">NEXT</div>' : '') +
      '<div class="icon">' + card.icon + '</div>' +
      '<div class="name">' + card.name + '</div>' +
      '<div class="stat mono">' + lines[0] + '</div>' +
      '<div class="stat mono">' + u.hp + '/' + u.maxHp + '</div>' +
      chargeLine +
      '<div class="hp-bar"><div class="hp-fill' + (pct < .34 ? ' low' : '') + '" style="width:' + (pct*100) + '%"></div></div>' +
      '<div class="charge-bar"><div class="charge-fill" style="width:' + (chargePct*100) + '%"></div></div>';
    var badgeEl = c.querySelector('.equip-badge');
    if (badgeEl) badgeEl.addEventListener('click', function(e){ e.stopPropagation(); inspectCard(u.equip.card, null); });
    var fireBtn = c.querySelector('.activate-btn');
    if (fireBtn) fireBtn.addEventListener('click', function(e){ e.stopPropagation(); activateUnit(side, idx); });
    c.addEventListener('click', function(){ inspectCard(card, { side: side, zone: 'unit', idx: idx }); if (interactive) onSlotClick(side, 'unit', idx); });
    if (interactive){
      c.addEventListener('dblclick', function(){ removePlacedCard(side, 'unit', idx); });
      c.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); inspectCard(card, { side: side, zone: 'unit', idx: idx }); onSlotClick(side, 'unit', idx); }
        else if (e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); removePlacedCard(side, 'unit', idx); }
      });
    }
    return c;
  }

  function renderZoneSlot(side, zone, idx){
    var player = state.players[side];
    var arr = zone === 'trap' ? player.traps : player.continuous;
    var inst = arr[idx];
    if (!inst){
      var validTarget = state.phase === 'setup' && state.selected && state.selected.side === side &&
        player.hand[state.selected.idx] && player.hand[state.selected.idx].type === zone;
      var slot = el('div', 'slot trap-slot' + (validTarget ? ' valid-target' : ''), { tabindex:'0', role:'button', 'aria-label':'empty ' + zone + ' slot' });
      slot.innerHTML = prioBadge(side, zone, idx) + '+';
      slot.addEventListener('click', function(){ onSlotClick(side, zone, idx); });
      slot.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onSlotClick(side, zone, idx); } });
      return slot;
    }
    var card = inst.card;
    var interactive = state.phase === 'setup';
    var isNext = !!(zone === 'continuous' && nextActor && nextActor.side === side && nextActor.continuousIdx === idx);
    var c = el('div', 'card placed trap-card ' + card.key + ' ' + cardColorClass(card) + (interactive ? ' selectable' : '') + (isNext ? ' next-actor' : ''),
      { tabindex:'0', role:'button', title: card.name + ' — ' + card.effect + (interactive ? ' (double-click to return to hand)' : '') });
    var statLine = zone === 'continuous' ? ('⚡' + (inst.charges || 0) + '/3')
      : card.manualArm ? (inst.primed ? 'ACTIVE' : 'DORMANT') : card.manualFire ? 'READY' : 'ARMED';
    if (zone === 'trap' && canActivateTrap(side, idx)) statLine = '<button class="activate-btn" type="button" title="Activate now: catches the next enemy attack">Activate</button>';
    c.innerHTML =
      prioBadge(side, zone, idx) +
      (isNext ? '<div class="next-tag">NEXT</div>' : '') +
      '<div class="icon">' + card.icon + '</div>' +
      '<div class="name">' + card.name + '</div>' +
      '<div class="stat mono">' + statLine + '</div>';
    var armBtn = c.querySelector('.activate-btn');
    if (armBtn) armBtn.addEventListener('click', function(e){ e.stopPropagation(); activateTrap(side, idx); });
    c.addEventListener('click', function(){ inspectCard(card, { side: side, zone: zone, idx: idx }); });
    if (interactive){
      c.addEventListener('dblclick', function(){ removePlacedCard(side, zone, idx); });
      c.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); inspectCard(card, { side: side, zone: zone, idx: idx }); }
        else if (e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); removePlacedCard(side, zone, idx); }
      });
    }
    return c;
  }

  function renderStructure(side, idx){
    var s = state.players[side].structures[idx];
    var wrap = el('div', 'structure' + (!s.alive ? ' dead' : ''));
    var pct = Math.max(0, s.hp / s.maxHp);
    wrap.innerHTML =
      '<div class="structure-shape"><div class="structure-fill" style="height:' + (pct*100) + '%"></div></div>' +
      '<div class="structure-hp mono">' + (s.alive ? ('S' + (idx+1) + ' ' + s.hp + '/' + s.maxHp) : ('S' + (idx+1) + ' DOWN')) + '</div>';
    return wrap;
  }

  function renderPlayerPanel(side){
    var p = state.players[side];
    document.getElementById('name-' + side).textContent = p.name;
    document.getElementById('deck-' + side).textContent = 'Deck ' + p.deck.length;
    var graveBtn = document.getElementById('grave-' + side);
    graveBtn.textContent = 'Grave ' + p.grave.length;
    graveBtn.onclick = function(){ toggleGrave(side); };

    var graveList = document.getElementById('graveList-' + side);
    graveList.hidden = !state.graveOpen[side];
    if (state.graveOpen[side]){
      graveList.innerHTML = '';
      if (p.grave.length === 0){
        var e = el('span', null); e.style.color = 'var(--text-dim)'; e.style.fontSize = '.72rem'; e.textContent = 'Empty.';
        graveList.appendChild(e);
      } else {
        p.grave.forEach(function(c, gi){
          var chip = el('span', 'grave-chip', { title: c.name + ' — ' + c.effect });
          chip.textContent = c.icon;
          chip.addEventListener('click', function(){ inspectCard(c, { side: side, zone: 'grave', idx: gi }); });
          graveList.appendChild(chip);
        });
      }
    }

    var structuresRow = document.getElementById('structures-' + side);
    structuresRow.innerHTML = '';
    for (var i = 0; i < STRUCTURE_COUNT; i++) structuresRow.appendChild(renderStructure(side, i));

    var unitsLabel = document.getElementById('units-' + side).previousElementSibling;
    unitsLabel.textContent = (state.attaching && state.attaching.side === side) ? 'Units — click a host for Parasite' : 'Units — lower # acts first';
    var unitsRow = document.getElementById('units-' + side);
    unitsRow.innerHTML = '';
    for (var u = 0; u < UNIT_SLOTS; u++) unitsRow.appendChild(renderUnitSlot(side, u));

    var trapsRow = document.getElementById('traps-' + side);
    trapsRow.innerHTML = '';
    for (var tI = 0; tI < TRAP_SLOTS; tI++) trapsRow.appendChild(renderZoneSlot(side, 'trap', tI));
    for (var cI = 0; cI < CONTINUOUS_SLOTS; cI++) trapsRow.appendChild(renderZoneSlot(side, 'continuous', cI));

    var handRow = document.getElementById('hand-' + side);
    handRow.innerHTML = '';
    var seenBefore = lastHandUids[side];
    var drawOrder = 0;
    p.hand.forEach(function(card, idx){
      var isNew = !seenBefore.has(card.uid);
      var cardEl = renderHandCard(side, card, idx);
      handRow.appendChild(cardEl);
      if (isNew){
        animateDraw(cardEl, side, drawOrder);
        drawOrder++;
      }
    });
    lastHandUids[side] = new Set(p.hand.map(function(c){ return c.uid; }));
  }

  var PHASE_LABEL = { setup:'Setup', simulating:'Simulating', roundEnd:'Round Complete', gameOver:'Game Over' };

  function renderHeader(){
    document.getElementById('roundLabel').textContent = state.round;
    document.getElementById('phaseLabel').textContent = state.phase === 'gameOver' && state.winner != null
      ? state.players[state.winner].name + ' Wins' : PHASE_LABEL[state.phase];

    var tickPill = document.getElementById('tickPill');
    var progressWrap = document.getElementById('progressWrap');
    var showTick = state.phase === 'simulating' || state.phase === 'roundEnd' || state.phase === 'gameOver';
    tickPill.hidden = !showTick;
    progressWrap.hidden = !showTick;
    if (showTick){
      document.getElementById('tickLabel').textContent = state.tick;
      document.getElementById('progressFill').style.width = (state.tick / SIM_TICKS * 100) + '%';
    }

    var nextPill = document.getElementById('nextPill');
    nextPill.hidden = !nextActor;
    if (nextActor){
      var np = state.players[nextActor.side];
      var actorCard = nextActor.continuousIdx !== undefined ? np.continuous[nextActor.continuousIdx].card : np.units[nextActor.idx].card;
      document.getElementById('nextLabel').textContent = np.name + "'s " + actorCard.name + ' @ t' + nextActor.tick;
      nextPill.className = 'pill next-pill p' + (nextActor.side + 1);
    }

    var mainBtn = document.getElementById('mainActionBtn');
    mainBtn.disabled = false;
    if (state.phase === 'setup'){ mainBtn.textContent = 'Reveal & Simulate'; mainBtn.onclick = startSimulation; }
    else if (state.phase === 'simulating'){
      if (!state.pendingChoice){ mainBtn.textContent = 'Step ▶'; mainBtn.onclick = stepOnce; }
      else { mainBtn.textContent = 'Awaiting choice…'; mainBtn.disabled = true; mainBtn.onclick = null; }
    }
    else if (state.phase === 'roundEnd'){ mainBtn.textContent = 'Draw & Continue'; mainBtn.onclick = continueToNextRound; }
    else { mainBtn.textContent = 'New Game'; mainBtn.onclick = resetGame; }

    var overlay = document.getElementById('overlay');
    if (state.phase === 'gameOver'){
      overlay.hidden = false;
      var winnerName = state.players[state.winner].name;
      var loserName = state.players[1 - state.winner].name;
      document.getElementById('overlayTitle').textContent = winnerName + ' Wins';
      document.getElementById('overlaySub').textContent = 'All of ' + loserName + "'s structures have fallen after " + state.round + ' round(s).';
    } else {
      overlay.hidden = true;
    }
  }

  function renderLog(){
    var body = document.getElementById('logBody');
    body.innerHTML = '';
    state.log.forEach(function(entry){
      var line = el('div', 'log-line ' + entry.type);
      line.textContent = entry.text;
      body.appendChild(line);
    });
    body.scrollTop = body.scrollHeight;
    document.getElementById('logCount').textContent = state.log.length + ' event' + (state.log.length === 1 ? '' : 's');
  }

  function renderChoiceOverlay(){
    var el2 = document.getElementById('choiceOverlay');
    if (!state.pendingChoice){ el2.hidden = true; return; }
    el2.hidden = false;
    document.getElementById('choiceTitle').textContent = state.pendingChoice.title;
    document.getElementById('choiceMessage').textContent = state.pendingChoice.message;
    var opts = document.getElementById('choiceOptions');
    opts.innerHTML = '';
    state.pendingChoice.options.forEach(function(opt){
      var b = document.createElement('button');
      b.className = 'btn primary';
      b.textContent = opt.label;
      b.onclick = function(){
        state.pendingChoice = null;
        opt.onClick();
        render();
      };
      opts.appendChild(b);
    });
  }

  var nextActor = null;
  function render(){
    nextActor = peekNextActor();
    renderHeader();
    renderPlayerPanel(0);
    renderPlayerPanel(1);
    renderLog();
    renderInspector();
    renderChoiceOverlay();
  }

  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && state.attaching){ state.attaching = null; render(); } });
  document.getElementById('resetBtn').addEventListener('click', resetGame);
  document.getElementById('inspectorClose').addEventListener('click', function(){ state.inspected = null; renderInspector(); });
  document.getElementById('overlayNewGame').addEventListener('click', resetGame);

  state = freshState();
  render();
})();
</script>
</body>
</html>
