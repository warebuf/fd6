<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fd6</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  html,body{ overflow:hidden; }

  /* ---------- Topbar ---------- */
  .status{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:.72rem; color:var(--text-dim); }
  .status b{ color:var(--text); font-weight:600; }
  .progress-wrap{ width:100px; height:5px; border-radius:999px; background:var(--panel-2); border:1px solid var(--line); overflow:hidden; }
  .progress-fill{ height:100%; background:linear-gradient(90deg,var(--p1),var(--p2)); width:0%; transition:width .12s linear; }

  /* ---------- Layout ---------- */
  .battlefield{
    flex:1 1 auto; min-height:0; max-width:1300px; width:100%; margin:0 auto;
    padding:8px 12px; display:flex; gap:10px;
  }

  .panel{
    flex:1 1 0; min-width:0; min-height:0;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:8px 10px; display:flex; flex-direction:column; gap:5px;
    border-top:3px solid var(--line); overflow:hidden;
  }
  .panel.p1{ border-top-color:var(--p1); }
  .panel.p2{ border-top-color:var(--p2); }

  .panel-head{ flex:0 0 auto; position:relative; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .panel-title{ font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:.88rem; display:flex; align-items:center; gap:7px; }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; flex:0 0 auto; }
  .panel.p1 .dot{ background:var(--p1); } .panel.p2 .dot{ background:var(--p2); }
  .pile-pills{ display:flex; gap:6px; font-size:.68rem; }
  .pile-pill{ border:1px solid var(--line); border-radius:6px; padding:2px 7px; background:var(--panel-2); cursor:pointer; color:var(--text-dim); }
  .pile-pill:hover{ color:var(--text); }
  .grave-list{
    position:absolute; top:100%; right:0; margin-top:4px; z-index:15;
    display:flex; flex-wrap:wrap; gap:4px; max-width:200px;
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:6px; box-shadow:var(--shadow);
  }
  .grave-chip{ width:20px; height:20px; display:flex; align-items:center; justify-content:center; border-radius:4px; background:var(--panel-2); border:1px solid var(--line); opacity:.7; font-size:.85rem; }

  /* Cards are sized by width (see --card-w / --trap-w), so each section is as tall as its content.
     The hand takes whatever height is left and wraps onto more lines instead of scrolling sideways. */
  .panel{ --card-w:70px; --trap-w:62px; }
  .section{ flex:0 0 auto; display:flex; flex-direction:column; gap:2px; }
  .sec-hand{ flex:1 1 auto; min-height:0; }
  .row-label{ flex:0 0 auto; font-size:.6rem; text-transform:uppercase; letter-spacing:.07em; color:var(--text-dim); }
  .row{ display:flex; flex-wrap:wrap; align-items:flex-start; align-content:flex-start; gap:5px; }
  .row.hand-row{ flex:1 1 auto; min-height:0; overflow-y:auto; }
  /* Traps / Field always holds exactly 7 slots: shrink them to fit the row rather than scroll. */
  .row.zone-row{ flex-wrap:nowrap; }
  .row.zone-row > .card, .row.zone-row > .slot{ flex:1 1 0; min-width:0; max-width:var(--trap-w); }


  /* slots + cards */
  .slot{
    width:var(--card-w); aspect-ratio:.72; border-radius:8px; border:1.5px dashed var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--text-dim);
    font-size:1.1rem; cursor:default; background:var(--panel-2); flex:0 0 auto; position:relative;
  }
  .prio-badge{
    position:absolute; top:2px; left:2px; min-width:13px; height:13px; padding:0 3px; border-radius:4px;
    font-size:8px; font-weight:600; line-height:13px; text-align:center;
    background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim); z-index:2;
  }
  .card .prio-badge{ background:var(--bg); }
  .slot.trap-slot{ width:var(--trap-w); }
  .slot.valid-target{ border-color:var(--p1); background:var(--p1-bg); cursor:pointer; color:var(--p1); }
  .panel.p2 .slot.valid-target{ border-color:var(--p2); background:var(--p2-bg); color:var(--p2); }

  .card{
    width:var(--card-w); aspect-ratio:.72; flex:0 0 auto; border-radius:8px; border:1.5px solid var(--line);
    background:var(--panel); padding:4% 3%; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start; gap:2%; text-align:center; cursor:pointer; position:relative; user-select:none;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card.trap-card{ width:var(--trap-w); }
  .card.cattack{ border-top:3px solid var(--danger); }
  .card.cheal{ border-top:3px solid var(--heal); }
  .card.ctrap{ border-top:3px solid var(--trap); }
  .card.cequip{ border-top:3px solid var(--equip); }
  .card.cspecial{ border-top:3px solid var(--special); }
  .card .icon{ font-size:clamp(11px,2vh,18px); line-height:1; }
  .card .name{ font-size:clamp(7px,1.35vh,10.5px); font-weight:600; line-height:1.1; }
  .card .stat{ font-size:clamp(6px,1.05vh,9px); color:var(--text-dim); line-height:1.15; }
  .card.selectable:hover{ transform:translateY(-3px); box-shadow:var(--shadow); }
  .card.is-selected{ transform:translateY(-5px); box-shadow:0 3px 10px rgba(0,0,0,.15); }
  .panel.p1 .card.is-selected{ border-color:var(--p1); box-shadow:0 0 0 2px var(--p1-bg), 0 3px 10px rgba(0,0,0,.1); }
  .panel.p2 .card.is-selected{ border-color:var(--p2); box-shadow:0 0 0 2px var(--p2-bg), 0 3px 10px rgba(0,0,0,.1); }
  .card.placed{ cursor:pointer; }
  .card.dim{ opacity:.55; }
  .card.valid-target{ box-shadow:0 0 0 2px var(--p1) inset; }
  .panel.p2 .card.valid-target{ box-shadow:0 0 0 2px var(--p2) inset; }
  .card.next-actor{ animation:next-pulse 1.1s ease-in-out infinite; }
  .panel.p1 .card.next-actor{ --next-color:var(--p1); }
  .panel.p2 .card.next-actor{ --next-color:var(--p2); }
  @keyframes next-pulse{
    0%,100%{ box-shadow:0 0 0 2px var(--next-color); }
    50%{ box-shadow:0 0 0 4px var(--next-color), 0 0 12px var(--next-color); }
  }
  .next-tag{
    position:absolute; bottom:3px; left:50%; transform:translateX(-50%);
    font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:7px; letter-spacing:.08em;
    padding:1px 5px; border-radius:999px; background:var(--next-color); color:var(--bg); z-index:2;
  }
  .next-pill.p1{ border-color:var(--p1); color:var(--p1); } .next-pill.p1 b{ color:var(--p1); }
  .next-pill.p2{ border-color:var(--p2); color:var(--p2); } .next-pill.p2 b{ color:var(--p2); }
  .activate-btn{
    font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:clamp(7px,1.15vh,9px); letter-spacing:.06em; text-transform:uppercase;
    padding:1px 7px; border-radius:999px; border:1px solid var(--text); background:var(--text); color:var(--bg);
    cursor:pointer; line-height:1.3; z-index:2; animation:next-pulse 1.4s ease-in-out infinite; --next-color:var(--special);
  }
  .activate-btn:hover:not([disabled]){ filter:brightness(1.15); }
  .activate-btn[disabled]{ opacity:.35; cursor:not-allowed; animation:none; background:transparent; color:var(--text-dim); border-color:var(--line); }
  .equip-badge{
    position:absolute; top:2px; right:2px; width:14px; height:14px; border-radius:50%;
    background:var(--equip); color:#fff; font-size:9px; display:flex; align-items:center;
    justify-content:center; line-height:1; z-index:2;
  }

  .hp-bar{ width:100%; height:3px; border-radius:999px; background:var(--panel-2); overflow:hidden; margin-top:1px; flex:0 0 auto; }
  .hp-fill{ height:100%; background:var(--heal); transition:width .2s ease; }
  .hp-fill.low{ background:var(--danger); }
  .charge-bar{ width:100%; height:2.5px; border-radius:999px; background:var(--panel-2); overflow:hidden; flex:0 0 auto; }
  .panel.p1 .charge-fill{ background:var(--p1); }
  .panel.p2 .charge-fill{ background:var(--p2); }
  .charge-fill{ height:100%; width:0%; }

  /* center column */
  .center-col{ flex:0 0 clamp(170px,20vw,240px); min-height:0; display:flex; flex-direction:column; gap:4px; }
  .center-label{
    flex:0 0 auto; text-align:center; font-family:'Chakra Petch',sans-serif; font-size:.68rem;
    color:var(--text-dim); letter-spacing:.15em; padding-bottom:2px; border-bottom:1px solid var(--line);
  }

  .grave-chip{ cursor:pointer; }

  /* log */
  .log-panel{
    flex:1 1 auto; min-height:0;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:8px 10px; display:flex; flex-direction:column; gap:4px;
  }
  .log-head{ flex:0 0 auto; display:flex; justify-content:space-between; align-items:center; font-size:.66rem; text-transform:uppercase; letter-spacing:.07em; color:var(--text-dim); }
  .log-body{ flex:1 1 auto; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:3px; font-size:.72rem; }
  .log-line{ padding:1px 0; }
  .log-line.attack{ color:var(--danger); }
  .log-line.heal{ color:var(--heal); }
  .log-line.trap{ color:var(--trap); font-weight:600; }
  .log-line.destroy{ color:var(--text-dim); font-style:italic; }
  .log-line.idle{ color:var(--text-dim); opacity:.75; }
  .log-line.meta{ color:var(--text-dim); border-top:1px dashed var(--line); padding-top:4px; margin-top:2px; }
  .log-line.win{ color:var(--text); font-weight:700; }
  .log-line .t{ color:var(--text-dim); margin-right:4px; }

  .overlay{
    position:fixed; inset:0; background:rgba(11,15,20,.55); display:flex;
    align-items:center; justify-content:center; z-index:50; padding:16px;
  }
  .overlay-card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:28px 24px; text-align:center; max-width:340px; box-shadow:0 10px 40px rgba(0,0,0,.3);
  }
  .overlay-card h2{ font-family:'Chakra Petch',sans-serif; margin:0 0 6px; font-size:1.4rem; }
  .overlay-card p{ color:var(--text-dim); margin:0 0 16px; font-size:.85rem; }

  @media (max-width:760px){
    html,body{ overflow-y:auto; }
    .battlefield{ flex-direction:column; overflow-y:auto; }
    .panel{ flex:0 0 auto; max-height:none; }
    .row.hand-row{ overflow-y:visible; }
    .center-col{ flex:0 0 auto; order:3; height:320px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">fd6<small>hotseat TCG battle-sim prototype</small></div>
    <div class="status">
      <span class="pill">Round <b id="roundLabel">1</b></span>
      <span class="pill mono" id="scorePill" title="Rounds won">P1 <b id="scoreLabel">0 – 0</b> P2</span>
      <span class="pill" id="phasePill">Phase: <b id="phaseLabel">Setup</b></span>
      <span class="pill mono" id="tickPill" hidden>Tick <b id="tickLabel">0</b>/60</span>
      <span class="pill next-pill" id="nextPill" hidden>Next: <b id="nextLabel"></b></span>
      <div class="progress-wrap" id="progressWrap" hidden><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="spacer"></div>
    <button class="btn primary" id="mainActionBtn">Reveal &amp; Simulate</button>
    <a class="btn ghost small" id="decksBtn" href="decks.html">Decks</a>
    <button class="btn ghost small" id="resetBtn">Reset</button>
  </div>
</header>

<div class="battlefield">
  <div class="panel p1" id="panel-0">
    <div class="panel-head">
      <div class="panel-title"><span class="dot"></span><span id="name-0"></span></div>
      <div class="pile-pills">
        <span class="pile-pill mono" id="deck-0"></span>
        <span class="pile-pill mono" id="grave-0"></span>
      </div>
      <div id="graveList-0" class="grave-list" hidden></div>
    </div>
    <div class="section sec-units">
      <div class="row-label">Units</div>
      <div class="row" id="units-0"></div>
    </div>
    <div class="section sec-traps">
      <div class="row-label">Traps / Field</div>
      <div class="row zone-row" id="traps-0"></div>
    </div>
    <div class="section sec-hand">
      <div class="row-label">Hand</div>
      <div class="row hand-row" id="hand-0"></div>
    </div>
  </div>

  <div class="center-col">
    <div class="center-label">Front Line</div>
    <div class="inspector" id="inspector">
      <div class="inspector-head"><span>Card Info</span><button class="inspector-close" id="inspectorClose" title="Clear" hidden>✕</button></div>
      <div id="inspectorBody"><div class="inspector-empty">Click any card to see what it does.</div></div>
    </div>
    <div class="log-panel">
      <div class="log-head"><span>Battle Log</span><span id="logCount">0 events</span></div>
      <div class="log-body" id="logBody"></div>
    </div>
  </div>

  <div class="panel p2" id="panel-1">
    <div class="panel-head">
      <div class="panel-title"><span class="dot"></span><span id="name-1"></span></div>
      <div class="pile-pills">
        <span class="pile-pill mono" id="deck-1"></span>
        <span class="pile-pill mono" id="grave-1"></span>
      </div>
      <div id="graveList-1" class="grave-list" hidden></div>
    </div>
    <div class="section sec-units">
      <div class="row-label">Units</div>
      <div class="row" id="units-1"></div>
    </div>
    <div class="section sec-traps">
      <div class="row-label">Traps / Field</div>
      <div class="row zone-row" id="traps-1"></div>
    </div>
    <div class="section sec-hand">
      <div class="row-label">Hand</div>
      <div class="row hand-row" id="hand-1"></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="overlay-card">
    <h2 id="overlayTitle">Player 1 Wins</h2>
    <p id="overlaySub"></p>
    <button class="btn primary" id="overlayNewGame">New Game</button>
  </div>
</div>

<div class="overlay" id="choiceOverlay" hidden>
  <div class="overlay-card">
    <h2 id="choiceTitle">Choice</h2>
    <p id="choiceMessage"></p>
    <div id="choiceOptions" style="display:flex; flex-direction:column; gap:8px;"></div>
  </div>
</div>

<script src="shared.js"></script>
<script>
(function(){
  "use strict";

  var deckRecipes = loadDeckRecipes();

  // Infinity = endless play: rounds are scored but the match never ends. Set a number (e.g. 3) for first-to-N.
  var ROUNDS_TO_WIN = Infinity, UNIT_SLOTS = 5, TRAP_SLOTS = 5, CONTINUOUS_SLOTS = 2;
  var PREDATOR_DEATH_AOE = 5;
  var OSSUARY_HP = 3;
  var VAULT_CAP = 5, MARTYR_CHARGES = 3;
  var PALLBEARER_MIN_COOLDOWN = 5;
  var DRAW_PER_ROUND = 3, SIM_TICKS = 60;

  var cardUid = 0;
  function makeCard(key){
    var def = CARD_DEFS[key] || TOKEN_DEFS[key];
    var c = { uid: 'c' + (cardUid++) };
    for (var k in def) c[k] = def[k];
    return c;
  }
  function shuffle(arr){
    for (var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }
  function buildDeck(side){
    var deck = [], recipe = deckRecipes[side];
    Object.keys(recipe).forEach(function(key){
      if (!CARD_DEFS[key]) return;
      for (var i = 0; i < recipe[key]; i++) deck.push(makeCard(key));
    });
    return shuffle(deck);
  }
  function newPlayer(name, side){
    return {
      name: name,
      deck: buildDeck(side),
      hand: [],
      grave: [],
      summonCount: 0,
      lastAction: null,
      units: new Array(UNIT_SLOTS).fill(null),
      traps: new Array(TRAP_SLOTS).fill(null),
      continuous: new Array(CONTINUOUS_SLOTS).fill(null)
    };
  }
  function drawCards(p, n){
    for (var i = 0; i < n; i++){
      if (p.deck.length === 0) return;
      p.hand.push(p.deck.pop());
    }
  }

  var state = null;
  var lastHandUids = [new Set(), new Set()];
  var reduceMotion = false;
  try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e){}

  function animateDraw(cardEl, side, order){
    if (reduceMotion || !cardEl.animate) return;
    var deckEl = document.getElementById('deck-' + side);
    if (!deckEl) return;
    var deckRect = deckEl.getBoundingClientRect();
    var cardRect = cardEl.getBoundingClientRect();
    var dx = (deckRect.left + deckRect.width / 2) - (cardRect.left + cardRect.width / 2);
    var dy = (deckRect.top + deckRect.height / 2) - (cardRect.top + cardRect.height / 2);
    try {
      cardEl.animate([
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.3) rotate(-10deg)', opacity: 0, offset: 0 },
        { transform: 'translate(' + (dx * 0.12) + 'px,' + (dy * 0.12) + 'px) scale(1.06) rotate(3deg)', opacity: 1, offset: 0.72 },
        { transform: 'translate(0,0) scale(1) rotate(0deg)', opacity: 1, offset: 1 }
      ], { duration: 420, delay: order * 70, easing: 'cubic-bezier(.22,.85,.28,1)', fill: 'both' });
    } catch (e){}
  }

  function freshState(){
    var s = {
      round: 1, phase: 'setup', tick: 0,
      selected: null, attaching: null, inspected: null, winner: null, log: [], graveOpen: [false,false],
      pendingChoice: null, tickQueue: [], tickQueuePos: 0,
      stack: [], responder: null, resolvingStack: false, roundWins: [0, 0],
      players: [newPlayer('Player 1', 0), newPlayer('Player 2', 1)]
    };
    s.players.forEach(function(p){ drawCards(p, INITIAL_HAND); });
    return s;
  }

  function addLog(text, type){
    state.log.push({ text:text, type:type });
    if (state.log.length > 300) state.log.shift();
  }

  // ---------- Simulation ----------
  function startSimulation(){
    if (state.phase !== 'setup') return;
    state.phase = 'simulating';
    state.tick = 0;
    state.selected = null;
    state.attaching = null;
    state.players.forEach(refreshBulwarks);
    addLog('Round ' + state.round + ': boards revealed. Battle begins. Press Step to advance.', 'meta');
    if (!checkForWipe()) render();   // a side that fielded no units loses the round on the spot
  }

  // ---------- Slot priority ----------
  // Every slot has a priority number; lower acts first when actions tie on the same tick. Numbers are
  // dealt snake-draft style: the side that is "first" gets 1,4,5,8,9,... and the other gets 2,3,6,7,10,...
  // One side is first for unit slots and second for trap/field slots; the other side is the reverse.
  // Which side is first for units swaps each round.
  function oddSide(){ return (state.round + 1) % 2; }

  function snakeNumber(pos, first){
    var odd = pos % 2 === 1;
    return first ? (2 * pos + 1 + (odd ? 1 : 0)) : (2 * pos + 2 - (odd ? 1 : 0));
  }

  function slotPriority(side, zone, idx){
    var unitsFirst = side === oddSide();
    if (zone === 'unit') return snakeNumber(idx, unitsFirst);
    var pos = zone === 'trap' ? idx : TRAP_SLOTS + idx;
    return snakeNumber(pos, !unitsFirst);
  }

  // Actors scheduled for tick t, ordered by slot priority.
  function queueForTick(t){
    var queue = [];
    for (var side = 0; side < 2; side++){
      var player = state.players[side];
      for (var i = 0; i < player.units.length; i++){
        var u = player.units[i];
        var cd = u ? unitCooldown(player, u.card) : 0;
        if (u && u.alive && isFinite(cd) && t % cd === 0) queue.push({ side: side, idx: i, prio: slotPriority(side, 'unit', i) });
      }
      for (var j = 0; j < player.continuous.length; j++){
        var cc = player.continuous[j];
        if (cc && cc.card.key === 'blackbox' && (cc.charges || 0) >= 3) queue.push({ side: side, continuousIdx: j, prio: slotPriority(side, 'continuous', j) });
      }
    }
    queue.sort(function(a, b){ return a.prio - b.prio; });
    return queue;
  }

  function buildTickQueue(){
    state.tickQueue = queueForTick(++state.tick);
    state.tickQueuePos = 0;
  }

  // The action the next Step click will resolve: the rest of the current tick's queue, or the first
  // actor of the next tick that has one. Null when nothing is left this round or a choice is pending.
  function peekNextActor(){
    if (state.phase !== 'simulating' || state.pendingChoice) return null;
    if (state.tickQueue && state.tickQueuePos < state.tickQueue.length){
      var item = state.tickQueue[state.tickQueuePos];
      return { side: item.side, idx: item.idx, continuousIdx: item.continuousIdx, tick: state.tick };
    }
    for (var t = state.tick + 1; t <= SIM_TICKS; t++){
      var q = queueForTick(t);
      if (q.length) return { side: q[0].side, idx: q[0].idx, continuousIdx: q[0].continuousIdx, tick: t };
    }
    return null;
  }

  function processQueueItem(item){
    if (item.continuousIdx !== undefined) return resolveBlackBox(item.side, item.continuousIdx);
    var u = state.players[item.side].units[item.idx];
    if (!u || !u.alive) return undefined;
    return performAction(item.side, item.idx, u, state.tick);
  }

  // Processes exactly one queued action from the current tick, then does the end-of-queue
  // bookkeeping (game over / end of round). Remaining actions wait for the next Step click.
  function drainQueue(){
    if (state.manualPause){
      state.manualPause = false;
      if (state.resolvingStack) resolveStack(); // a choice opened mid-resolution; finish the rest of the stack
      else if (!checkForWipe()) render();
      return;
    }
    if (state.tickQueuePos < state.tickQueue.length){
      var item = state.tickQueue[state.tickQueuePos++];
      var result = processQueueItem(item);
      if (result === 'PAUSED'){ render(); return; }
    }
    if (checkForWipe()) return;
    render();
    if (state.tickQueuePos >= state.tickQueue.length && state.tick >= SIM_TICKS) endSimulation();
  }

  function stepOnce(){
    if (state.phase !== 'simulating' || state.pendingChoice || state.responder !== null || state.resolvingStack) return;
    if (state.tickQueue && state.tickQueuePos < state.tickQueue.length){
      drainQueue();
      return;
    }
    while (state.phase === 'simulating' && !state.pendingChoice){
      if (state.tick >= SIM_TICKS){ endSimulation(); return; }
      buildTickQueue();
      if (state.tickQueue.length > 0){ drainQueue(); return; }
      render(); // keep the tick counter live while silently skipping ticks with no scheduled actions
    }
  }

  function pauseForChoice(config){
    state.pendingChoice = config;
    render();
  }

  function consumeTrap(side, idx){
    var p = state.players[side];
    if (!p.traps[idx]) return;
    p.grave.push(p.traps[idx].card);
    p.traps[idx] = null;
  }

  function findOtherLivingUnit(player, excludeIdx){
    for (var i = 0; i < player.units.length; i++){
      if (i !== excludeIdx && player.units[i] && player.units[i].alive) return i;
    }
    return -1;
  }

  function findWeakestUnit(player, excludeIdx){
    var bestIdx = -1, bestPct = Infinity;
    player.units.forEach(function(u, i){
      if (i === excludeIdx || !u || !u.alive) return;
      var pct = u.hp / u.maxHp;
      if (pct < bestPct){ bestPct = pct; bestIdx = i; }
    });
    return bestIdx;
  }

  function findStrongestUnit(player, excludeIdx){
    var bestIdx = -1, bestHp = -1;
    player.units.forEach(function(u, i){
      if (i === excludeIdx || !u || !u.alive) return;
      if (u.hp > bestHp){ bestHp = u.hp; bestIdx = i; }
    });
    return bestIdx;
  }

  function findLivingScavengerNoEquip(preferredSide){
    var order = [preferredSide, 1 - preferredSide];
    for (var oi = 0; oi < order.length; oi++){
      var s = order[oi], p = state.players[s];
      for (var i = 0; i < p.units.length; i++){
        var uu = p.units[i];
        if (uu && uu.alive && uu.card.key === 'scavenger' && !uu.equip) return { side: s, idx: i };
      }
    }
    return null;
  }

  function findLivingBodyguardSlot(player){
    for (var i = 0; i < player.units.length; i++){
      if (player.units[i] && player.units[i].alive && player.units[i].card.key === 'bodyguard') return i;
    }
    return -1;
  }

  // ---------- Bulwark ----------
  // Bulwark is the reward for fielding nothing else: alone on its side it doubles up and taunts, so
  // every enemy attack has to chew through it first. The bonus is re-evaluated whenever the board changes
  // during setup and locked in when the battle begins, so units dying mid-round don't switch it on halfway.
  function countLivingUnits(player){
    return player.units.filter(function(u){ return u && u.alive; }).length;
  }
  function isTaunting(u){ return !!(u && u.alive && u.taunting); }
  function refreshBulwarks(player){
    var lonely = countLivingUnits(player) === 1;
    player.units.forEach(function(u){
      if (!u || !u.alive || u.card.key !== 'bulwark') return;
      if (!!u.taunting === lonely) return;
      u.taunting = lonely;
      if (lonely){ u.maxHp += u.card.hp; u.hp += u.card.hp; }          // the bonus is +base HP, i.e. double
      else { u.maxHp -= u.card.hp; u.hp = Math.min(u.hp, u.maxHp); }
    });
  }
  function findTauntSlot(player){
    for (var i = 0; i < player.units.length; i++){ if (isTaunting(player.units[i])) return i; }
    return -1;
  }

  // Charges are pooled across a player's living units (see tryHijack): these helpers read and spend that pool.
  function findVault(player){
    for (var i = 0; i < player.continuous.length; i++){ if (player.continuous[i] && player.continuous[i].card.key === 'vault') return player.continuous[i]; }
    return null;
  }
  function vaultDeposit(player, amount){
    var v = findVault(player);
    if (!v || amount <= 0) return 0;
    var take = Math.min(amount, VAULT_CAP - (v.charges || 0));
    if (take <= 0) return 0;
    v.charges = (v.charges || 0) + take;
    return take;
  }
  function totalCharges(player){
    var sum = 0;
    player.units.forEach(function(u){ if (u && u.alive) sum += (u.charges || 0); });
    var v = findVault(player);
    return sum + (v ? (v.charges || 0) : 0);
  }

  function spendCharges(player, amount){
    var v = findVault(player);
    if (v && v.charges > 0){
      var fromVault = Math.min(v.charges, amount);
      v.charges -= fromVault;
      amount -= fromVault;
    }
    for (var i = 0; i < player.units.length && amount > 0; i++){
      var u = player.units[i];
      if (!u || !u.alive || !(u.charges > 0)) continue;
      var take = Math.min(u.charges, amount);
      u.charges -= take;
      amount -= take;
    }
  }

  // Conduit tracks its target by card uid rather than slot, so the link survives the target moving slots and
  // simply goes quiet if the target dies or the two of them end up on opposite boards (Donation, Scavenger).
  function findUnitSlotByUid(player, uid){
    for (var i = 0; i < player.units.length; i++){
      if (player.units[i] && player.units[i].alive && player.units[i].card.uid === uid) return i;
    }
    return -1;
  }
  function conduitTargetSlot(player, u){
    if (!u || !u.equip || u.equip.card.key !== 'conduit' || u.equip.targetUid == null) return -1;
    return findUnitSlotByUid(player, u.equip.targetUid);
  }

  // Prefers a unit that can actually spend charges; otherwise any living unit can hold them for Hijack / Standoff.
  function findChargeRecipient(player, excludeIdx){
    for (var i = 0; i < player.units.length; i++){
      var u = player.units[i];
      if (i !== excludeIdx && u && u.alive && u.card.usesCharges) return i;
    }
    return findOtherLivingUnit(player, excludeIdx);
  }

  // Used only inside tryHijack, which is deep in synchronous attack/heal resolution and can't pause for a choice.
  function chargeExtortion(activatingSide){
    var other = 1 - activatingSide;
    var op = state.players[other];
    var count = 0;
    op.units.forEach(function(u){ if (u && u.alive && u.card.key === 'extortionist') count++; });
    for (var i = 0; i < count; i++){
      var idx = findChargeRecipient(op, -1);
      if (idx === -1) return;
      gainCharges(other, idx, 1);
      addLog(op.name + "'s Extortionist extracts 1 charge for " + op.units[idx].card.name + '.', 'trap');
    }
  }

  // Lets the Extortionist's owner pick which of their units gets the charge. Calls next() once resolved
  // (synchronously if no Extortionist is out) and returns 'PAUSED' if it opened a choice modal.
  function chargeExtortionChoice(activatingSide, next){
    var other = 1 - activatingSide;
    var op = state.players[other];
    var hasExtortionist = op.units.some(function(u){ return u && u.alive && u.card.key === 'extortionist'; });
    if (!hasExtortionist) return next();
    var targets = [];
    op.units.forEach(function(u, i){ if (u && u.alive) targets.push(i); });
    if (targets.length === 0) return next();
    var unitLabel = function(i){ var u = op.units[i]; return u.card.name + ' (' + u.hp + '/' + u.maxHp + ' HP)'; };
    pauseForChoice({
      title: 'Extortionist',
      message: op.name + ', choose which of your cards gains 1 charge from Extortionist.',
      options: targets.map(function(i){
        return { label: unitLabel(i), onClick: function(){
          gainCharges(other, i, 1);
          addLog(op.name + "'s Extortionist extracts 1 charge for " + op.units[i].card.name + '.', 'trap');
          var result = next();
          if (result !== 'PAUSED') drainQueue();
        }};
      })
    });
    return 'PAUSED';
  }

  function gainCharges(side, slotIdx, amount){
    var p = state.players[side];
    var u = p.units[slotIdx];
    if (!u) return;
    u.charges = (u.charges || 0) + amount;
    p.units.forEach(function(par, i){
      if (par && par.alive && par.card.key === 'parasite' && par.hostSlot === slotIdx) par.charges = (par.charges || 0) + amount;
    });
    if (u.equip && u.equip.card.key === 'battery') u.equip.storedCharges = Math.min(3, (u.equip.storedCharges || 0) + amount);
  }

  // ---------- Death handling ----------
  function destroyUnit(side, idx, opts){
    opts = opts || {};
    var p = state.players[side];
    var u = p.units[idx];
    if (!u) return;
    var card = u.card;

    if (u.equip && u.equip.card.key === 'deathless'){
      p.grave.push(u.equip.card);
      u.equip = null;
      addLog(p.name + "'s Deathless shatters, saving " + card.name + '.', 'trap');
      return;
    }
    if (u.equip && u.equip.card.key === 'inheritance'){
      var heirIdx = findOtherLivingUnit(p, idx);
      if (heirIdx !== -1){
        p.units[heirIdx].equip = u.equip;
        addLog(u.equip.card.name + ' passes on to ' + p.units[heirIdx].card.name + '.', 'meta');
      } else {
        p.grave.push(u.equip.card);
      }
      u.equip = null;
    }
    if (u.equip && u.equip.card.key === 'deadmanswitch'){
      var dmsCard = u.equip.card;
      u.equip = null;
      forcePerformAction(side, idx, u, state.tick);
      p.grave.push(dmsCard);
    }
    if (u.equip && u.equip.card.key === 'battery'){
      var stored = u.equip.storedCharges || 0;
      var batCard = u.equip.card;
      u.equip = null;
      if (stored > 0){
        var otherIdx = findOtherLivingUnit(p, idx);
        if (otherIdx !== -1) p.units[otherIdx].charges = (p.units[otherIdx].charges || 0) + stored;
      }
      p.grave.push(batCard);
    }
    if (u.equip){
      var eqCard = u.equip.card;
      u.equip = null;
      var scav = findLivingScavengerNoEquip(side);
      if (scav){
        state.players[scav.side].units[scav.idx].equip = { card: eqCard, storedCharges: 0 };
        addLog(state.players[scav.side].name + "'s Scavenger claims " + eqCard.name + '.', 'meta');
      } else {
        p.grave.push(eqCard);
      }
    }

    p.grave.push(card);
    // Loops that hold a reference to this unit (a Gravedigger volley, a Mimic copy) check u.alive between
    // hits, so the death has to show on the instance as well as clearing the slot.
    u.alive = false;
    p.units[idx] = null;

    if (card.key === 'martyr' && !opts.martyrPaid){
      var heir = findChargeRecipient(p, idx);
      if (heir !== -1){
        gainCharges(side, heir, MARTYR_CHARGES);
        addLog(p.name + "'s Martyr passes " + MARTYR_CHARGES + ' charges to ' + p.units[heir].card.name + ' as it dies.', 'meta');
      }
    }
    var banked = vaultDeposit(p, u.charges || 0);
    if (banked > 0) addLog(p.name + "'s Vault catches " + banked + ' charge(s) from ' + card.name + '.', 'meta');
    p.units.forEach(function(uu){ if (uu && uu.alive && uu.card.key === 'undertaker') uu.charges = (uu.charges || 0) + 1; });
    p.continuous.forEach(function(cc){ if (cc && cc.card.key === 'blackbox') cc.charges = (cc.charges || 0) + 1; });
    p.units.forEach(function(uu){ if (uu && uu.alive && uu.card.key === 'parasite' && uu.hostSlot === idx) uu.hostSlot = null; });

    if (card.key === 'predator'){
      addLog(p.name + "'s Predator lashes out as it dies, hitting its own side for " + PREDATOR_DEATH_AOE + " true damage.", 'attack');
      p.units.forEach(function(uu, i){
        if (!uu || !uu.alive) return;
        uu.hp -= PREDATOR_DEATH_AOE;
        addLog(p.name + "'s " + uu.card.name + ' takes ' + PREDATOR_DEATH_AOE + ' from the death throes.', 'attack');
        if (uu.hp <= 0) destroyUnit(side, i, {});
      });
    }
  }

  function forcePerformAction(side, idx, u, t){
    var card = u.card;
    var selfPlayer = state.players[side];
    if (card.unitType === 'attacker'){
      var power = card.ad;
      if (u.equip && u.equip.card.key === 'veteranstandard') power += selfPlayer.summonCount;
      resolveAttackHit(side, 1 - side, power, selfPlayer.name + "'s " + card.name + " (Dead Man's Switch)", t, undefined, { disarm: card.key === 'disarmer' });
    } else if (card.unitType === 'healer'){
      var best = findHealTarget(selfPlayer);
      if (best) applyHeal(selfPlayer, best, card.ap, selfPlayer.name + "'s " + card.name + " (Dead Man's Switch)", t);
    } else if (card.key === 'gravedigger'){
      var graveCount = selfPlayer.grave.length;
      for (var k = 0; k < graveCount; k++) resolveAttackHit(side, 1 - side, card.ap, selfPlayer.name + "'s Gravedigger (Dead Man's Switch)", t, undefined, { dmgType: 'magic' });
    } else if (card.key === 'loadedgun'){
      resolveAttackHit(side, 1 - side, card.ap, selfPlayer.name + "'s Loaded Gun (Dead Man's Switch)", t, undefined, { dmgType: 'magic' });
    }
    // mimic/undertaker/parasite/extortionist/bodyguard/scavenger have no meaningful forced retaliation — skipped.
  }

  // ---------- Heal helpers ----------
  function findHealTarget(player){
    var best = null, bestPct = 1;
    player.units.forEach(function(u, idx){
      if (u && u.alive && u.hp < u.maxHp){
        var pct = u.hp / u.maxHp;
        if (pct < bestPct){ bestPct = pct; best = { kind: 'unit', idx: idx }; }
      }
    });
    return best;
  }
  function applyHeal(player, best, amount, label, t){
    var u = player.units[best.idx];
    var before = u.hp;
    u.hp = Math.min(u.maxHp, u.hp + amount);
    addLog('t' + t + ': ' + label + ' heals ' + u.card.name + ' for ' + (u.hp - before) + '.', 'heal');
  }

  // ---------- Damage types ----------
  // Physical damage (auto-attacks) is reduced by armor, magic damage (abilities) by magic resist, and true
  // damage by nothing — League's formula: taken = dmg × 100 / (100 + resist), rounded, at least 1.
  function mitigatedDamage(amount, dmgType, u){
    if (amount <= 0) return 0;
    var resist = dmgType === 'physical' ? (u.card.armor || 0) : dmgType === 'magic' ? (u.card.mr || 0) : 0;
    return Math.max(1, Math.round(amount * 100 / (100 + resist)));
  }
  function damageNote(raw, dealt, dmgType){
    if (dealt === raw) return '';
    return ' (' + raw + ' ' + dmgType + ', ' + (dmgType === 'physical' ? 'armor' : 'MR') + ' blocked ' + (raw - dealt) + ')';
  }

  // ---------- Attack resolution pipeline ----------
  function pickAttackTarget(dp){
    var taunt = findTauntSlot(dp);
    if (taunt !== -1) return { kind: 'unit', idx: taunt };
    for (var i = 0; i < dp.units.length; i++){ if (dp.units[i] && dp.units[i].alive) return { kind: 'unit', idx: i }; }
    return null;
  }

  // attackerIdx: slot of the attacking unit, when there is one (Black Box replays and dying units pass none).
  function resolveAttackHit(attackerSide, defSide, power, sourceLabel, t, attackerIdx, opts){
    var dp = state.players[defSide];
    var target = pickAttackTarget(dp);
    if (!target) return undefined;
    var trapResult = triggerArmedTrap(defSide, attackerSide, power, target.kind, target.idx, t, attackerIdx);
    if (trapResult === 'PAUSED') return 'PAUSED';
    if (trapResult === true) return undefined;
    var bgSlot = findLivingBodyguardSlot(dp);
    // Bodyguard intercepts automatically — no prompt. A taunt still outranks it: the attack is already
    // forced onto the Bulwark, so Bodyguard cannot pull it back off.
    if (bgSlot !== -1 && !(target.kind === 'unit' && target.idx === bgSlot) && findTauntSlot(dp) === -1){
      addLog('t' + t + ': ' + dp.name + "'s Bodyguard steps in front of " + dp.units[target.idx].card.name + '.', 'trap');
      return applyDamageToTarget(attackerSide, defSide, 'unit', bgSlot, power, sourceLabel, t, opts);
    }
    return applyDamageToTarget(attackerSide, defSide, target.kind, target.idx, power, sourceLabel, t, opts);
  }

  function applyDamageToTarget(attackerSide, defSide, kind, idx, power, sourceLabel, t, opts){
    var dp = state.players[defSide];
    if (kind === 'unit'){
      var target = dp.units[idx];
      if (!target) return undefined;
      // Disarmer trades its damage for the target's gear. Traps and Bodyguard have already had their say
      // above, so a Disarmer's swing can still be reflected or intercepted like any other attack.
      if (opts && opts.disarm && target.equip){
        var stripped = target.equip.card;
        target.equip = null;
        dp.grave.push(stripped);
        addLog('t' + t + ': ' + sourceLabel + ' tears ' + stripped.name + ' off ' + dp.name + "'s " + target.card.name + ' and destroys it.', 'destroy');
        return undefined;
      }
      var dmgType = (opts && opts.dmgType) || 'physical';
      var dealt = mitigatedDamage(power, dmgType, target);
      target.hp -= dealt;
      addLog('t' + t + ': ' + sourceLabel + ' hits ' + dp.name + "'s " + target.card.name + ' for ' + dealt + damageNote(power, dealt, dmgType) + '.', 'attack');
      var condIdx = conduitTargetSlot(dp, target);   // pays out even on a lethal hit
      if (condIdx !== -1){
        gainCharges(defSide, condIdx, 1);
        addLog(dp.name + "'s Conduit passes 1 charge to " + dp.units[condIdx].card.name + '.', 'meta');
      }
      if (target.equip && target.equip.card.key === 'gravestone'){   // also pays out on a lethal hit
        dp.grave.push(makeCard('gravetoken'));
        addLog(dp.name + "'s Gravestone adds a Grave Token to the graveyard.", 'meta');
      }
      if (target.hp <= 0){
        var lwIdx = -1;
        for (var i = 0; i < dp.traps.length; i++){ if (dp.traps[i] && dp.traps[i].card.key === 'lastwill'){ lwIdx = i; break; } }
        if (lwIdx !== -1){
          var dyingName = target.card.name;
          chargeExtortionChoice(defSide, function(){
            pauseForChoice({
              title: "Last Will",
              message: dp.name + "'s " + dyingName + ' has taken lethal damage. Save it at 1 HP, or let it die and draw 2 cards?',
              options: [
                { label: 'Save at 1 HP', onClick: function(){
                    target.hp = 1;
                    addLog(dp.name + "'s Last Will saves " + dyingName + ' at 1 HP.', 'trap');
                    consumeTrap(defSide, lwIdx);
                    drainQueue();
                }},
                { label: 'Let it die, draw 2', onClick: function(){
                    destroyUnit(defSide, idx, { killedByOpponent: true });
                    drawCards(dp, 2);
                    addLog(dp.name + "'s Last Will lets " + dyingName + ' die — 2 cards drawn.', 'trap');
                    consumeTrap(defSide, lwIdx);
                    drainQueue();
                }}
              ]
            });
            return 'PAUSED';
          });
          return 'PAUSED';
        }
        destroyUnit(defSide, idx, { killedByOpponent: true });
      }
      return undefined;
    }
    return undefined;
  }

  // ---------- Trap dispatcher (fires when an attack lands) ----------
  function triggerArmedTrap(defSide, attackerSide, power, targetKind, targetIdx, t, attackerIdx){
    var dp = state.players[defSide];
    var TRAP_KEYS = ['mirror', 'donation', 'liquidator', 'mutualdestruction', 'standoff', 'repossess', 'cannibalize'];
    var foundIdx = -1;
    for (var i = 0; i < dp.traps.length; i++){
      var tr = dp.traps[i];
      if (!tr || TRAP_KEYS.indexOf(tr.card.key) === -1) continue;
      if (tr.card.manualFire) continue;              // only ever fired by the player
      if (tr.card.manualArm && !tr.primed) continue; // player hasn't activated it yet
      foundIdx = i; break;
    }
    if (foundIdx === -1) return false;
    var key = dp.traps[foundIdx].card.key;
    var resolveNow = function(){
      switch (key){
        case 'mirror': resolveMirror(defSide, attackerSide, foundIdx, attackerIdx); return true;
        case 'donation': resolveDonation(defSide, attackerSide, foundIdx); return true;
        case 'liquidator': resolveLiquidator(defSide, foundIdx); return true;
        case 'repossess': resolveRepossess(defSide, attackerSide, foundIdx); return true;
        case 'cannibalize': resolveCannibalize(defSide, foundIdx); return true;
        case 'standoff': return resolveStandoff(defSide, attackerSide, foundIdx);
        case 'mutualdestruction': return resolveMutualDestruction(defSide, attackerSide, foundIdx, t);
      }
      return false;
    };
    return chargeExtortionChoice(defSide, resolveNow);
  }

  function resolveMirror(defSide, attackerSide, foundIdx, attackerIdx){
    var dp = state.players[defSide], ap = state.players[attackerSide];
    var attacker = attackerIdx !== undefined ? ap.units[attackerIdx] : null;
    if (attacker && attacker.alive){
      addLog(dp.name + "'s Mirror Wall reflects the attack — " + ap.name + "'s " + attacker.card.name + ' is destroyed!', 'trap');
      destroyUnit(attackerSide, attackerIdx, { killedByOpponent: true });
    } else {
      addLog(dp.name + "'s Mirror Wall negates the attack, but there is no attacking unit to destroy.", 'trap');
    }
    consumeTrap(defSide, foundIdx);
  }

  function resolveDonation(defSide, attackerSide, foundIdx){
    var dp = state.players[defSide], ap = state.players[attackerSide];
    var idx = findWeakestUnit(dp);
    if (idx === -1){ addLog(dp.name + "'s Donation fizzles — no unit to give away.", 'trap'); consumeTrap(defSide, foundIdx); return; }
    var emptyIdx = ap.units.findIndex(function(x){ return !x; });
    if (emptyIdx === -1){
      addLog(dp.name + "'s Donation has nowhere to send " + dp.units[idx].card.name + ' — it is destroyed instead.', 'destroy');
      destroyUnit(defSide, idx, {});
    } else {
      var inst = dp.units[idx];
      dp.units[idx] = null;
      ap.units[emptyIdx] = inst;
      addLog(dp.name + ' donates ' + inst.card.name + ' to ' + ap.name + '.', 'trap');
    }
    consumeTrap(defSide, foundIdx);
  }

  function resolveLiquidator(defSide, foundIdx){
    var dp = state.players[defSide];
    var alive = [];
    dp.units.forEach(function(u, i){ if (u && u.alive) alive.push(i); });
    if (alive.length < 1){ addLog(dp.name + "'s Liquidator fizzles — no unit to sacrifice.", 'trap'); consumeTrap(defSide, foundIdx); return; }
    var unitLabel = function(i){ var u = dp.units[i]; return u.card.name + ' (' + u.hp + '/' + u.maxHp + ' HP)'; };
    pauseForChoice({
      title: 'Liquidator',
      message: dp.name + ', choose a unit to sacrifice.',
      options: alive.map(function(sacIdx){
        return { label: unitLabel(sacIdx), onClick: function(){
          var sac = dp.units[sacIdx];
          var gained = Math.floor(sac.hp / 5);
          var receivers = alive.filter(function(i){ return i !== sacIdx && dp.units[i] && dp.units[i].alive; });
          if (gained <= 0 || receivers.length === 0){
            addLog(dp.name + "'s Liquidator sacrifices " + sac.card.name + ' but it yields no charges.', 'trap');
            destroyUnit(defSide, sacIdx, {});
            consumeTrap(defSide, foundIdx);
            drainQueue();
            return;
          }
          pauseForChoice({
            title: 'Liquidator',
            message: dp.name + ', choose the unit to receive ' + gained + ' charge' + (gained === 1 ? '' : 's') + ' from ' + sac.card.name + '.',
            options: receivers.map(function(recIdx){
              return { label: unitLabel(recIdx), onClick: function(){
                gainCharges(defSide, recIdx, gained);
                addLog(dp.name + "'s Liquidator sacrifices " + sac.card.name + ' for ' + gained + ' charge' + (gained === 1 ? '' : 's') + ', paid to ' + dp.units[recIdx].card.name + '.', 'trap');
                destroyUnit(defSide, sacIdx, {});
                consumeTrap(defSide, foundIdx);
                drainQueue();
              }};
            })
          });
        }};
      })
    });
    return 'PAUSED';
  }

  function resolveRepossess(defSide, attackerSide, foundIdx){
    var dp = state.players[defSide], ap = state.players[attackerSide];
    var idx = -1;
    for (var i = 0; i < ap.units.length; i++){
      if (ap.units[i] && ap.units[i].alive && ap.units[i].originalOwner === defSide){ idx = i; break; }
    }
    if (idx === -1){ addLog(dp.name + "'s Repossess fizzles — nothing of theirs to reclaim.", 'trap'); consumeTrap(defSide, foundIdx); return; }
    var inst = ap.units[idx];
    var emptyIdx = dp.units.findIndex(function(x){ return !x; });
    ap.units[idx] = null;
    if (emptyIdx === -1){
      dp.grave.push(inst.card);
      addLog(dp.name + ' repossesses ' + inst.card.name + ' but has no room for it — it is scrapped.', 'trap');
    } else {
      dp.units[emptyIdx] = inst;
      addLog(dp.name + ' repossesses ' + inst.card.name + '!', 'trap');
    }
    consumeTrap(defSide, foundIdx);
  }

  function resolveCannibalize(defSide, foundIdx){
    var dp = state.players[defSide];
    var alive = [];
    dp.units.forEach(function(u, i){ if (u && u.alive) alive.push(i); });
    if (alive.length < 2){ addLog(dp.name + "'s Cannibalize fizzles — not enough units.", 'trap'); consumeTrap(defSide, foundIdx); return; }
    var unitLabel = function(i){ var u = dp.units[i]; return u.card.name + ' (' + u.hp + '/' + u.maxHp + ' HP)'; };
    pauseForChoice({
      title: 'Cannibalize',
      message: dp.name + ', choose a unit to sacrifice.',
      options: alive.map(function(sacIdx){
        return { label: unitLabel(sacIdx), onClick: function(){
          var receivers = alive.filter(function(i){ return i !== sacIdx && dp.units[i] && dp.units[i].alive; });
          pauseForChoice({
            title: 'Cannibalize',
            message: dp.name + ', choose the unit that receives ' + dp.units[sacIdx].card.name + "'s " + dp.units[sacIdx].hp + ' HP.',
            options: receivers.map(function(recIdx){
              return { label: unitLabel(recIdx), onClick: function(){
                var sac = dp.units[sacIdx], rec = dp.units[recIdx];
                rec.maxHp += sac.hp; rec.hp += sac.hp;
                addLog(dp.name + ' cannibalizes ' + sac.card.name + ' into ' + rec.card.name + ' (+' + sac.hp + ' HP).', 'trap');
                destroyUnit(defSide, sacIdx, {});
                consumeTrap(defSide, foundIdx);
                drainQueue();
              }};
            })
          });
        }};
      })
    });
    return 'PAUSED';
  }

  function bidOptionsFor(player){
    var r = totalCharges(player);
    var presets = [0, 1, 2, 3, 5];
    var set = [];
    presets.forEach(function(v){ if (v <= r && set.indexOf(v) === -1) set.push(v); });
    if (r > 0 && set.indexOf(r) === -1) set.push(r);
    if (set.indexOf(0) === -1) set.unshift(0);
    set.sort(function(a, b){ return a - b; });
    return set;
  }

  function resolveStandoff(defSide, attackerSide, foundIdx){
    var dp = state.players[defSide], ap = state.players[attackerSide];
    var defOpts = bidOptionsFor(dp);
    pauseForChoice({
      title: 'Standoff',
      message: dp.name + ', choose your bid (Charges: ' + totalCharges(dp) + ').',
      options: defOpts.map(function(v){
        return { label: (v === totalCharges(dp) && v > 0) ? ('All (' + v + ')') : String(v), onClick: function(){
          var defBid = v;
          var atkOpts = bidOptionsFor(ap);
          pauseForChoice({
            title: 'Standoff',
            message: ap.name + ', choose your bid (Charges: ' + totalCharges(ap) + ').',
            options: atkOpts.map(function(v2){
              return { label: (v2 === totalCharges(ap) && v2 > 0) ? ('All (' + v2 + ')') : String(v2), onClick: function(){
                var atkBid = v2;
                spendCharges(dp, defBid);
                spendCharges(ap, atkBid);
                if (defBid > atkBid){ drawCards(dp, 2); addLog(dp.name + ' wins the Standoff (' + defBid + ' vs ' + atkBid + ') and draws 2 cards.', 'trap'); }
                else if (atkBid > defBid){ drawCards(ap, 2); addLog(ap.name + ' wins the Standoff (' + atkBid + ' vs ' + defBid + ') and draws 2 cards.', 'trap'); }
                else { addLog('The Standoff ends in a tie (' + defBid + ' vs ' + atkBid + '). Neither side draws.', 'trap'); }
                consumeTrap(defSide, foundIdx);
                drainQueue();
              }};
            })
          });
        }};
      })
    });
    return 'PAUSED';
  }

  function resolveMutualDestruction(defSide, attackerSide, foundIdx, t){
    var dp = state.players[defSide], ap = state.players[attackerSide];
    var dpIdxs = []; dp.units.forEach(function(u, i){ if (u && u.alive) dpIdxs.push(i); });
    var apIdxs = []; ap.units.forEach(function(u, i){ if (u && u.alive) apIdxs.push(i); });
    if (!dpIdxs.length || !apIdxs.length){
      addLog(dp.name + "'s Mutual Destruction fizzles — not enough units on the field.", 'trap');
      consumeTrap(defSide, foundIdx);
      return true;
    }
    pauseForChoice({
      title: 'Mutual Destruction',
      message: dp.name + ', choose one of your units to swap into combat.',
      options: dpIdxs.map(function(i){
        return { label: dp.units[i].card.name + ' (slot ' + (i + 1) + ')', onClick: function(){
          var dpPick = i;
          pauseForChoice({
            title: 'Mutual Destruction',
            message: ap.name + ', choose one of your units to swap into combat.',
            options: apIdxs.map(function(j){
              return { label: ap.units[j].card.name + ' (slot ' + (j + 1) + ')', onClick: function(){
                var apPick = j;
                var tmp = dp.units[dpPick];
                dp.units[dpPick] = ap.units[apPick];
                ap.units[apPick] = tmp;
                addLog(dp.name + ' and ' + ap.name + ' swap ' + dp.units[dpPick].card.name + ' and ' + ap.units[apPick].card.name + ' in the chaos!', 'trap');
                consumeTrap(defSide, foundIdx);
                var r1 = performAction(defSide, dpPick, dp.units[dpPick], t);
                if (r1 === 'PAUSED') return;
                var r2 = performAction(attackerSide, apPick, ap.units[apPick], t);
                if (r2 === 'PAUSED') return;
                drainQueue();
              }};
            })
          });
        }};
      })
    });
    return 'PAUSED';
  }

  // ---------- Hijack (auto-resolve redirect) ----------
  function tryHijack(activatingSide){
    var opp = 1 - activatingSide;
    var op = state.players[opp];
    var hijackIdx = -1;
    for (var i = 0; i < op.traps.length; i++){ if (op.traps[i] && op.traps[i].card.key === 'hijack'){ hijackIdx = i; break; } }
    if (hijackIdx === -1) return null;
    var chargedSlot = -1;
    for (var j = 0; j < op.units.length; j++){ if (op.units[j] && op.units[j].alive && (op.units[j].charges || 0) > 0){ chargedSlot = j; break; } }
    var vault = findVault(op);
    if (chargedSlot === -1 && !(vault && vault.charges > 0)) return null;
    chargeExtortion(opp);
    if (chargedSlot === -1) vault.charges -= 1;
    else op.units[chargedSlot].charges -= 1;
    consumeTrap(opp, hijackIdx);
    addLog(op.name + "'s Hijack seizes control of the effect!", 'trap');
    return opp;
  }

  function hitOwnWeakest(side, amount, label, t, dmgType){
    var p = state.players[side];
    var idx = findWeakestUnit(p);
    if (idx === -1){
      addLog('t' + t + ': ' + label + ' backfires, but ' + p.name + ' has no unit for it to hit.', 'meta');
      return;
    }
    var target = p.units[idx];
    var dealt = mitigatedDamage(amount, dmgType || 'physical', target);
    target.hp -= dealt;
    addLog('t' + t + ': ' + label + ' backfires onto ' + p.name + "'s " + target.card.name + ' for ' + dealt + damageNote(amount, dealt, dmgType || 'physical') + '.', 'attack');
    if (target.hp <= 0) destroyUnit(side, idx, { killedByOpponent: true });
  }

  // ---------- Per-card unit actions ----------
  function doAttackerAction(side, slotIdx, u, t){
    var card = u.card;
    var selfPlayer = state.players[side];
    var power = card.ad;
    if (u.equip && u.equip.card.key === 'veteranstandard') power += selfPlayer.summonCount;
    selfPlayer.lastAction = { kind: 'attack', amount: power, dmgType: 'physical' };
    return resolveAttackHit(side, 1 - side, power, selfPlayer.name + "'s " + card.name, t, slotIdx, { disarm: card.key === 'disarmer' });
  }

  // Every scheduled action leaves a log line, even when it has nothing to do.
  function logIdle(side, name, t, reason){
    addLog('t' + t + ': ' + state.players[side].name + "'s " + name + ' takes its turn — ' + reason + '.', 'idle');
  }

  function doHealerAction(side, slotIdx, u, t){
    var card = u.card;
    var selfPlayer = state.players[side];
    var best = findHealTarget(selfPlayer);
    selfPlayer.lastAction = { kind: 'heal', amount: card.ap };
    if (!best){ logIdle(side, card.name, t, 'nothing is wounded'); return; }
    applyHeal(selfPlayer, best, card.ap, selfPlayer.name + "'s " + card.name, t);
  }

  function doGravedigger(side, slotIdx, u, t){
    if (!(u.charges > 0)){ logIdle(side, u.card.name, t, 'no charge to spend'); return; }
    var hijacked = tryHijack(side);
    var selfPlayer = state.players[side];
    var graveCount = selfPlayer.grave.length;
    u.charges = 0;
    addLog('t' + t + ': ' + selfPlayer.name + "'s Gravedigger unleashes " + graveCount + ' strike(s) from the grave!', 'attack');
    for (var k = 0; k < graveCount; k++){
      if (hijacked !== null){ hitOwnWeakest(hijacked, u.card.ap, selfPlayer.name + "'s Gravedigger (hijacked)", t, 'magic'); continue; }
      var r = resolveAttackHit(side, 1 - side, u.card.ap, selfPlayer.name + "'s Gravedigger", t, slotIdx, { dmgType: 'magic' });
      if (r === 'PAUSED') return 'PAUSED'; // remaining hits in this volley are dropped if one hit opens a choice modal
      if (!u.alive) break;                 // e.g. reflected by Mirror Wall mid-volley
    }
  }

  function doUndertaker(side, slotIdx, u, t){
    if (!(u.charges >= 2)){ logIdle(side, u.card.name, t, 'needs 2 charges, has ' + (u.charges || 0)); return; }
    var hijacked = tryHijack(side);
    var selfPlayer = state.players[side];
    if (hijacked !== null){
      u.charges -= 2;
      addLog('t' + t + ': ' + selfPlayer.name + "'s Undertaker is hijacked — its recall fizzles.", 'trap');
      return;
    }
    var foundIdx = -1;
    for (var i = selfPlayer.grave.length - 1; i >= 0; i--){ if (selfPlayer.grave[i].type === 'unit'){ foundIdx = i; break; } }
    if (foundIdx === -1){ logIdle(side, u.card.name, t, 'no unit in the graveyard to recall'); return; }
    u.charges -= 2;
    var card = selfPlayer.grave.splice(foundIdx, 1)[0];
    selfPlayer.hand.push(card);
    addLog('t' + t + ': ' + selfPlayer.name + "'s Undertaker recalls " + card.name + ' from the grave.', 'heal');
  }

  function doParasite(side, slotIdx, u, t){
    var selfPlayer = state.players[side];
    if (u.hostSlot !== null && u.hostSlot !== undefined){
      var host = selfPlayer.units[u.hostSlot];
      logIdle(side, u.card.name, t, 'stays attached to ' + (host ? host.card.name : 'its host'));
      return;
    }
    for (var i = 0; i < selfPlayer.units.length; i++){
      if (i !== slotIdx && selfPlayer.units[i] && selfPlayer.units[i].alive){
        u.hostSlot = i;
        addLog('t' + t + ': ' + selfPlayer.name + "'s Parasite had no host, so it latches onto " + selfPlayer.units[i].card.name + '.', 'meta');
        return;
      }
    }
    logIdle(side, u.card.name, t, 'no unit to attach to');
  }

  function doLoadedGun(side, slotIdx, u, t){
    if (!(u.charges > 0)){ logIdle(side, u.card.name, t, 'no charge to spend'); return; }
    var hijacked = tryHijack(side);
    u.charges -= 1;
    var selfPlayer = state.players[side];
    var label = selfPlayer.name + "'s Loaded Gun";
    var result;
    addLog('t' + t + ': ' + selfPlayer.name + ' fires Loaded Gun (' + u.charges + ' charge(s) left).', 'meta');
    if (hijacked !== null) hitOwnWeakest(hijacked, u.card.ap, label + ' (hijacked)', t, 'magic');
    else result = resolveAttackHit(side, 1 - side, u.card.ap, label, t, slotIdx, { dmgType: 'magic' });
    if (u.charges <= 0) destroyUnit(side, slotIdx, {});
    if (result === 'PAUSED') return 'PAUSED';
  }

  function doMimic(side, slotIdx, u, t){
    if (!(u.charges > 0)){ logIdle(side, u.card.name, t, 'no charge to spend'); return; }
    var hijacked = tryHijack(side);
    var selfPlayer = state.players[side];
    var templateIdx = -1;
    for (var i = 0; i < selfPlayer.units.length; i++){
      if (i !== slotIdx && selfPlayer.units[i] && selfPlayer.units[i].alive){ templateIdx = i; break; }
    }
    if (templateIdx === -1){ logIdle(side, u.card.name, t, 'no unit to copy'); return; }
    u.charges -= 1;
    var template = selfPlayer.units[templateIdx].card;
    var label = selfPlayer.name + "'s Mimic (as " + template.name + ')';
    if (hijacked !== null){
      var amt = template.unitType === 'attacker' ? template.ad : (template.ap || 2);
      hitOwnWeakest(hijacked, amt, label + ' (hijacked)', t, template.unitType === 'attacker' ? 'physical' : 'magic');
      return;
    }
    if (template.unitType === 'attacker'){
      var power = template.ad;
      if (selfPlayer.units[templateIdx].equip && selfPlayer.units[templateIdx].equip.card.key === 'veteranstandard') power += selfPlayer.summonCount;
      var r = resolveAttackHit(side, 1 - side, power, label, t, slotIdx, { disarm: template.key === 'disarmer' });
      selfPlayer.lastAction = { kind: 'attack', amount: power, dmgType: 'physical' };
      if (r === 'PAUSED') return 'PAUSED';
    } else if (template.unitType === 'healer'){
      var best = findHealTarget(selfPlayer);
      if (best){ applyHeal(selfPlayer, best, template.ap, label, t); selfPlayer.lastAction = { kind: 'heal', amount: template.ap }; }
      else logIdle(side, label, t, 'nothing is wounded');
    } else {
      // Mimic only copies Striker/Medic-style templates in this prototype, not other specials.
      logIdle(side, label, t, 'cannot copy that kind of unit');
    }
  }

  function doMartyr(side, slotIdx, u, t){
    if (!(u.charges > 0)){ logIdle(side, u.card.name, t, 'no charge to spend'); return; }
    var selfPlayer = state.players[side];
    var targets = [];
    selfPlayer.units.forEach(function(x, i){ if (i !== slotIdx && x && x.alive) targets.push(i); });
    if (targets.length === 0){ logIdle(side, u.card.name, t, 'no unit to receive its charges'); return; }
    var unitLabel = function(i){ var x = selfPlayer.units[i]; return x.card.name + ' (' + x.hp + '/' + x.maxHp + ' HP)'; };
    pauseForChoice({
      title: 'Martyr',
      message: selfPlayer.name + ', choose the unit to receive ' + MARTYR_CHARGES + ' charges from Martyr.',
      options: targets.map(function(i){
        return { label: unitLabel(i), onClick: function(){
          gainCharges(side, i, MARTYR_CHARGES);
          addLog('t' + t + ': ' + selfPlayer.name + "'s Martyr gives " + MARTYR_CHARGES + ' charges to ' + selfPlayer.units[i].card.name + ' and destroys itself.', 'meta');
          destroyUnit(side, slotIdx, { martyrPaid: true });
          drainQueue();
        }};
      })
    });
    return 'PAUSED';
  }

  function findGraveTokenIdx(player){
    for (var i = player.grave.length - 1; i >= 0; i--){ if (player.grave[i].key === 'gravetoken') return i; }
    return -1;
  }
  // Same uid link Conduit uses, so the target can change slots without the Ossuary losing track of it.
  function ossuaryTargetSlot(player, inst){
    if (!inst || inst.card.key !== 'ossuary' || inst.targetUid == null) return -1;
    return findUnitSlotByUid(player, inst.targetUid);
  }
  // The dead a Pallbearer carries drive it on: every Grave Token in its own graveyard shaves 10% off the
  // gap between its swings, down to PALLBEARER_MIN_COOLDOWN. Every other unit just uses its printed cooldown.
  function unitCooldown(player, card){
    if (card.key !== 'pallbearer' || !isFinite(card.cooldown)) return card.cooldown;
    var tokens = countGraveTokens(player);
    if (!tokens) return card.cooldown;
    return Math.max(PALLBEARER_MIN_COOLDOWN, Math.round(card.cooldown * Math.max(0, 1 - 0.1 * tokens)));
  }
  function countGraveTokens(player){
    return player.grave.filter(function(c){ return c.key === 'gravetoken'; }).length;
  }

  function resolveOssuary(side, continuousIdx){
    var p = state.players[side];
    var slot = p.continuous[continuousIdx];
    if (!slot || slot.card.key !== 'ossuary') return;
    if (findGraveTokenIdx(p) === -1){
      addLog('t' + state.tick + ': ' + p.name + "'s Ossuary fizzles — no Grave Token to spend.", 'meta');
      return;
    }
    // A permanent +3, the way Cannibalize hands over HP — it raises the cap, so it is never wasted on a healthy unit.
    var feed = function(tgt){
      var tokenIdx = findGraveTokenIdx(p);
      if (tokenIdx === -1 || !p.units[tgt] || !p.units[tgt].alive) return undefined;
      p.grave.splice(tokenIdx, 1);
      var u = p.units[tgt];
      u.maxHp += OSSUARY_HP;
      u.hp += OSSUARY_HP;
      addLog('t' + state.tick + ': ' + p.name + "'s Ossuary feeds " + u.card.name + ' +' + OSSUARY_HP + ' HP (' + u.hp + '/' + u.maxHp + ').', 'heal');
      return undefined;
    };
    var tgt = ossuaryTargetSlot(p, slot);
    if (tgt !== -1) return chargeExtortionChoice(side, function(){ return feed(tgt); });

    // No target picked during setup, or it died: choose one now instead of letting the card sit useless.
    var living = [];
    p.units.forEach(function(u, i){ if (u && u.alive) living.push(i); });
    if (!living.length){ addLog('t' + state.tick + ': ' + p.name + "'s Ossuary fizzles — no living unit to feed.", 'meta'); return; }
    pauseForChoice({
      title: 'Ossuary',
      message: p.name + ', choose the unit your Ossuary feeds. It keeps feeding this unit from now on.',
      options: living.map(function(i){
        var lu = p.units[i];
        return { label: lu.card.name + ' (' + lu.hp + '/' + lu.maxHp + ' HP)', onClick: function(){
          slot.targetUid = lu.card.uid;
          var r = chargeExtortionChoice(side, function(){ return feed(i); });
          if (r !== 'PAUSED') drainQueue();
        }};
      })
    });
    return 'PAUSED';
  }

  function resolveBlackBox(side, continuousIdx){
    var p = state.players[side];
    var slot = p.continuous[continuousIdx];
    if (!slot || slot.card.key !== 'blackbox') return;
    if ((slot.charges || 0) < 3) return;
    var resolveNow = function(){
      slot.charges -= 3;
      if (!p.lastAction){ logIdle(side, slot.card.name, state.tick, 'no attack or heal to replay'); return; }
      var label = p.name + "'s Black Box (replay)";
      if (p.lastAction.kind === 'attack'){
        var r = resolveAttackHit(side, 1 - side, p.lastAction.amount, label, state.tick, undefined, { dmgType: p.lastAction.dmgType || 'physical' });
        if (r === 'PAUSED') return 'PAUSED';
      } else {
        var best = findHealTarget(p);
        if (best) applyHeal(p, best, p.lastAction.amount, label, state.tick);
      }
    };
    return chargeExtortionChoice(side, resolveNow);
  }

  // ---------- Player-activated abilities ----------
  // Activating an ability only declares it. The opponent then gets a response window: they may declare one of
  // their own abilities in response (which hands the window back), or pass. A pass resolves everything declared,
  // newest first. Costs are paid on resolution, so an ability whose source is gone or drained by then fizzles.
  function isDeclared(uid){ return state.stack.some(function(d){ return d.uid === uid; }); }
  function mayActivateNow(side){
    if (state.phase !== 'simulating' || state.pendingChoice || state.resolvingStack) return false;
    return state.responder === null || state.responder === side;
  }
  function unitHasActivation(u){
    return !!(u && u.alive && u.card.activatable && (u.charges || 0) >= (u.card.activateCost || 1));
  }
  // Ossuary is the only continuous with a player-activated ability: its cost is a Grave Token, and it
  // needs a live target to feed, so a declaration with neither still on the board fizzles on resolution.
  function continuousHasActivation(player, cc){
    if (!cc || cc.card.key !== 'ossuary') return false;
    if (findGraveTokenIdx(player) === -1) return false;
    return player.units.some(function(u){ return u && u.alive; });
  }
  // Why the Feed button is greyed out, so the card never just looks broken.
  function continuousBlockedReason(side, idx){
    var p = state.players[side], cc = p.continuous[idx];
    if (!cc || cc.card.key !== 'ossuary') return '';
    if (state.phase !== 'simulating') return 'Only during the battle';
    if (state.responder !== null && state.responder !== side) return 'Waiting on the other player to respond or pass';
    if (state.pendingChoice || state.resolvingStack) return 'Finish the current effect first';
    if (findGraveTokenIdx(p) === -1) return 'No Grave Token in your graveyard to spend';
    if (!p.units.some(function(u){ return u && u.alive; })) return 'No living unit to feed';
    return '';
  }
  function trapHasActivation(tr){
    return !!(tr && (tr.card.manualFire || (tr.card.manualArm && !tr.primed)));
  }
  function findContinuousSlotByUid(player, uid){
    for (var i = 0; i < player.continuous.length; i++){ if (player.continuous[i] && player.continuous[i].card.uid === uid) return i; }
    return -1;
  }
  function findTrapSlotByUid(player, uid){
    for (var i = 0; i < player.traps.length; i++){ if (player.traps[i] && player.traps[i].card.uid === uid) return i; }
    return -1;
  }

  function canActivate(side, idx){
    var u = state.players[side].units[idx];
    return mayActivateNow(side) && unitHasActivation(u) && !isDeclared(u.card.uid);
  }

  function canActivateTrap(side, idx){
    var tr = state.players[side].traps[idx];
    return mayActivateNow(side) && trapHasActivation(tr) && !isDeclared(tr.card.uid);
  }

  function canActivateContinuous(side, idx){
    var p = state.players[side];
    var cc = p.continuous[idx];
    return mayActivateNow(side) && continuousHasActivation(p, cc) && !isDeclared(cc.card.uid);
  }

  function declareAbility(side, zone, idx){
    var p = state.players[side];
    var arr = zone === 'unit' ? p.units : zone === 'trap' ? p.traps : p.continuous;
    var card = arr[idx].card;
    var inResponse = state.stack.length > 0;
    state.stack.push({ side: side, zone: zone, uid: card.uid, name: card.name });
    state.responder = 1 - side;
    addLog('t' + state.tick + ': ' + p.name + ' declares ' + card.name + (inResponse ? ' in response' : '') +
      ' — ' + state.players[1 - side].name + ' may respond or pass.', 'meta');
    render();
  }

  function activateUnit(side, idx){
    if (canActivate(side, idx)) declareAbility(side, 'unit', idx);
  }

  function activateTrap(side, idx){
    if (canActivateTrap(side, idx)) declareAbility(side, 'trap', idx);
  }

  function activateContinuous(side, idx){
    if (canActivateContinuous(side, idx)) declareAbility(side, 'continuous', idx);
  }

  function passResponse(){
    if (state.responder === null) return;
    addLog(state.players[state.responder].name + ' passes.', 'meta');
    state.responder = null;
    resolveStack();
  }

  // Resolves declarations newest-first. If one opens a choice, that choice's handler ends in drainQueue(),
  // which (because manualPause is set) calls back in here to finish the rest instead of consuming a Step.
  function resolveStack(){
    state.resolvingStack = true;
    while (state.stack.length && state.phase === 'simulating'){
      var result = resolveDeclared(state.stack.pop());
      if (result === 'PAUSED'){ state.manualPause = true; render(); return; }
      if (checkForWipe()) return;
    }
    state.stack = [];
    state.resolvingStack = false;
    if (!checkForWipe()) render();
  }

  function resolveDeclared(d){
    var p = state.players[d.side];
    var t = state.tick;
    var fizzle = function(){ addLog('t' + t + ': ' + p.name + "'s " + d.name + ' fizzles — it can no longer activate.', 'meta'); };
    if (d.zone === 'unit'){
      var idx = findUnitSlotByUid(p, d.uid);
      var u = idx === -1 ? null : p.units[idx];
      if (!unitHasActivation(u)){ fizzle(); return; }
      switch (u.card.key){
        case 'loadedgun': return doLoadedGun(d.side, idx, u, t);
        case 'undertaker': return doUndertaker(d.side, idx, u, t);
        case 'martyr': return doMartyr(d.side, idx, u, t);
        case 'gravedigger': return doGravedigger(d.side, idx, u, t);
      }
      return;
    }
    if (d.zone === 'continuous'){
      var cIdx = findContinuousSlotByUid(p, d.uid);
      if (cIdx === -1 || !continuousHasActivation(p, p.continuous[cIdx])){ fizzle(); return; }
      return resolveOssuary(d.side, cIdx);
    }
    var tIdx = findTrapSlotByUid(p, d.uid);
    var tr = tIdx === -1 ? null : p.traps[tIdx];
    if (!trapHasActivation(tr)){ fizzle(); return; }
    if (tr.card.manualArm){
      tr.primed = true;
      addLog('t' + t + ': ' + p.name + "'s " + tr.card.name + ' activates — it will catch the next enemy attack.', 'trap');
      return;
    }
    addLog('t' + t + ': ' + p.name + "'s " + tr.card.name + ' activates.', 'trap');
    return chargeExtortionChoice(d.side, function(){
      switch (tr.card.key){
        case 'liquidator': return resolveLiquidator(d.side, tIdx);
        case 'cannibalize': return resolveCannibalize(d.side, tIdx);
        case 'standoff': return resolveStandoff(d.side, 1 - d.side, tIdx);
        case 'donation': resolveDonation(d.side, 1 - d.side, tIdx); return;
        case 'repossess': resolveRepossess(d.side, 1 - d.side, tIdx); return;
      }
    });
  }

  // ---------- Dispatcher ----------
  function performAction(side, slotIdx, u, t){
    var card = u.card;
    switch (card.unitType){
      case 'attacker': return doAttackerAction(side, slotIdx, u, t);
      case 'healer': return doHealerAction(side, slotIdx, u, t);
      case 'special':
        switch (card.key){
          case 'gravedigger': return doGravedigger(side, slotIdx, u, t);
          case 'undertaker': return doUndertaker(side, slotIdx, u, t);
          case 'parasite': return doParasite(side, slotIdx, u, t);
          case 'loadedgun': return doLoadedGun(side, slotIdx, u, t);
          case 'mimic': return doMimic(side, slotIdx, u, t);
          case 'martyr': return doMartyr(side, slotIdx, u, t);
        }
        return;
      default: return;
    }
  }

  // ---------- Rounds ----------
  // A round is won by wiping out every enemy unit. If the clock runs out first, or both sides are wiped at
  // once, the round is a tie and nobody scores. First to ROUNDS_TO_WIN round wins takes the match.
  function checkForWipe(){
    if (state.phase !== 'simulating' || state.pendingChoice) return false;
    var alive = state.players.map(countLivingUnits);
    if (alive[0] > 0 && alive[1] > 0) return false;
    endRound(alive[0] > 0 ? 0 : alive[1] > 0 ? 1 : null, alive[0] === 0 && alive[1] === 0 ? 'both sides were wiped out' : '');
    return true;
  }

  function endSimulation(){
    endRound(null, 'time ran out with units still standing on both sides');
  }

  function endRound(winner, reason){
    state.stack = []; state.responder = null; state.resolvingStack = false; state.manualPause = false;
    state.tickQueue = []; state.tickQueuePos = 0;
    var score = ' (' + state.roundWins[0] + '–' + state.roundWins[1] + ')';
    if (winner === null){
      addLog('Round ' + state.round + ' is a tie — ' + reason + '. Score stays ' + score.slice(2, -1) + '.', 'meta');
      state.phase = 'roundEnd';
    } else {
      state.roundWins[winner]++;
      score = state.roundWins[0] + '–' + state.roundWins[1];
      addLog(state.players[1 - winner].name + ' has no units left — ' + state.players[winner].name + ' wins round ' + state.round + '. Score ' + score + '.', 'win');
      if (state.roundWins[winner] >= ROUNDS_TO_WIN){
        state.phase = 'gameOver';
        state.winner = winner;
        addLog(state.players[winner].name + ' wins the match ' + score + '!', 'win');
      } else {
        state.phase = 'roundEnd';
      }
    }
    render();
  }

  // Every round is a fresh fight: whatever is still on the board goes to its owner's graveyard. This is a
  // cleanup, not a death — no death triggers (Predator, Undertaker, Black Box, Vault...) fire.
  function clearBoard(p){
    p.units.forEach(function(u){
      if (!u) return;
      if (u.equip) p.grave.push(u.equip.card);
      p.grave.push(u.card);
    });
    p.traps.forEach(function(tr){ if (tr) p.grave.push(tr.card); });
    p.continuous.forEach(function(cc){ if (cc) p.grave.push(cc.card); });
    p.units = new Array(UNIT_SLOTS).fill(null);
    p.traps = new Array(TRAP_SLOTS).fill(null);
    p.continuous = new Array(CONTINUOUS_SLOTS).fill(null);
    p.lastAction = null;
  }

  function continueToNextRound(){
    if (state.phase !== 'roundEnd') return;
    state.round++;
    state.players.forEach(function(p){ clearBoard(p); drawCards(p, DRAW_PER_ROUND); });
    addLog('Round ' + state.round + ': the board is cleared. Each player draws ' + DRAW_PER_ROUND + '.', 'meta');
    state.phase = 'setup';
    state.tick = 0;
    render();
  }

  // ---------- Setup interactions ----------
  function onHandCardClick(side, idx){
    if (state.phase !== 'setup') return;
    state.attaching = null;
    if (state.selected && state.selected.side === side && state.selected.idx === idx){
      state.selected = null;
    } else {
      state.selected = { side: side, idx: idx };
    }
    render();
  }

  function onSlotClick(side, zone, idx){
    if (state.phase !== 'setup') return;
    var player = state.players[side];
    var sel = state.selected;
    var selCard = (sel && sel.side === side) ? player.hand[sel.idx] : null;

    if (zone === 'unit'){
      var existingUnit = player.units[idx];
      var att = state.attaching;
      if (att && att.side === side){
        // Choosing a target for the Ossuary in continuous slot att.idx.
        if (att.kind === 'ossuary'){
          var oss = player.continuous[att.idx];
          if (existingUnit && existingUnit.alive && oss && oss.card.key === 'ossuary'){
            oss.targetUid = existingUnit.card.uid;
            state.attaching = null;
            render();
          }
          return;
        }
        // Choosing a target for the Conduit worn by the unit in att.idx — including that unit itself.
        if (att.kind === 'conduit'){
          var wearer = player.units[att.idx];
          if (existingUnit && existingUnit.alive && wearer && wearer.equip && wearer.equip.card.key === 'conduit'){
            wearer.equip.targetUid = existingUnit.card.uid;
            state.attaching = null;
            render();
          }
          return;
        }
        // Choosing a host for the Parasite in att.idx.
        if (idx === att.idx){ state.attaching = null; render(); return; }
        if (existingUnit && existingUnit.alive){
          player.units[att.idx].hostSlot = idx;
          state.attaching = null;
          render();
        }
        return;
      }
      if (existingUnit && selCard && selCard.type === 'equip' && !existingUnit.equip){
        player.hand.splice(sel.idx, 1);
        existingUnit.equip = { card: selCard, storedCharges: 0, targetUid: null };
        state.selected = null;
        if (selCard.key === 'conduit') state.attaching = { side: side, idx: idx, kind: 'conduit' };
        render();
        return;
      }
      if (existingUnit){
        // Clicking a placed Parasite starts (or restarts) host selection; removal is a double-click.
        if (existingUnit.card.key === 'parasite'){ state.selected = null; state.attaching = { side: side, idx: idx, kind: 'parasite' }; render(); }
        return;
      }
      if (selCard && selCard.type === 'unit'){
        player.hand.splice(sel.idx, 1);
        player.units[idx] = { card: selCard, hp: selCard.hp, maxHp: selCard.hp, alive: true, charges: selCard.startCharges || 0, equip: null, originalOwner: side, hostSlot: null, taunting: false };
        player.summonCount += 1;
        refreshBulwarks(player);
        state.selected = null;
        if (selCard.key === 'parasite') state.attaching = { side: side, idx: idx, kind: 'parasite' }; // go straight to picking a host
        render();
        return;
      }
      return;
    }

    if (zone === 'trap' || zone === 'continuous'){
      state.attaching = null;
      var arr = zone === 'trap' ? player.traps : player.continuous;
      if (arr[idx]){
        // Occupied: clicking a placed Ossuary re-opens target selection. Removal is still a double-click.
        if (arr[idx].card.key === 'ossuary'){ state.selected = null; state.attaching = { side: side, idx: idx, kind: 'ossuary' }; render(); }
        return;
      }
      if (!selCard) return;
      if (zone === 'trap' && selCard.type !== 'trap') return;
      if (zone === 'continuous' && selCard.type !== 'continuous') return;
      player.hand.splice(sel.idx, 1);
      arr[idx] = zone === 'continuous' ? { card: selCard, charges: 0, targetUid: null } : { card: selCard };
      state.selected = null;
      if (selCard.key === 'ossuary') state.attaching = { side: side, idx: idx, kind: 'ossuary' };
      render();
    }
  }

  // Double-click (or Delete/Backspace) on a placed card during setup returns it to hand.
  function removePlacedCard(side, zone, idx){
    if (state.phase !== 'setup') return;
    var player = state.players[side];
    if (zone === 'unit'){
      var u = player.units[idx];
      if (!u) return;
      if (u.equip) player.hand.push(u.equip.card); // equip comes back to hand with its unit
      player.hand.push(u.card);
      player.units[idx] = null;
      player.units.forEach(function(uu){ if (uu && uu.hostSlot === idx) uu.hostSlot = null; });
      refreshBulwarks(player);
    } else {
      var arr = zone === 'trap' ? player.traps : player.continuous;
      if (!arr[idx]) return;
      player.hand.push(arr[idx].card);
      arr[idx] = null;
    }
    state.selected = null;
    state.attaching = null;
    if (state.inspected && state.inspected.loc && state.inspected.loc.side === side && state.inspected.loc.zone === zone && state.inspected.loc.idx === idx) state.inspected = null;
    render();
  }

  function autoPlaceCard(side, handIdx){
    if (state.phase !== 'setup') return;
    var player = state.players[side];
    var card = player.hand[handIdx];
    if (!card) return;
    var zone, targetIdx = -1;
    if (card.type === 'unit'){
      zone = 'unit';
      targetIdx = player.units.findIndex(function(u){ return !u; });
    } else if (card.type === 'trap'){
      zone = 'trap';
      targetIdx = player.traps.findIndex(function(t){ return !t; });
    } else if (card.type === 'continuous'){
      zone = 'continuous';
