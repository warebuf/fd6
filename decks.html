<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deck Builder · fd6</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  html,body{ overflow:hidden; }

  .deck-tabs{ display:flex; gap:4px; }
  .deck-tab.active{ background:var(--text); color:var(--bg); border-color:var(--text); }

  .builder{
    flex:1 1 auto; min-height:0; max-width:1300px; width:100%; margin:0 auto;
    padding:10px 14px; display:flex; gap:12px;
  }
  .pane{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    display:flex; flex-direction:column; min-height:0; overflow:hidden;
  }
  .pool-pane{ flex:1 1 56%; }
  .side-col{ flex:1 1 44%; display:flex; flex-direction:column; gap:12px; min-height:0; }
  .deck-pane{ flex:1 1 auto; }
  /* fixed height so hovering cards with longer effect text doesn't push the deck list around */
  .side-col .inspector{ height:150px; overflow-y:auto; }

  .pane-head{ flex:0 0 auto; padding:10px 12px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
  .pane-title{ font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:.85rem; letter-spacing:.03em; text-transform:uppercase; color:var(--text-dim); }
  .pane-toolbar{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .pane-toolbar input[type="search"], .pane-toolbar select{
    font-family:inherit; font-size:.76rem; padding:5px 9px; border-radius:8px;
    border:1px solid var(--line); background:var(--panel-2); color:var(--text);
  }
  .pane-toolbar input[type="search"]{ flex:1 1 140px; min-width:110px; }

  .deck-summary{ display:flex; gap:14px; flex-wrap:wrap; font-size:.72rem; color:var(--text-dim); }
  .deck-summary span:first-child{ color:var(--text); font-weight:600; }
  .deck-summary.warn span:first-child{ color:var(--danger); }

  .pane-list{ flex:1 1 auto; min-height:0; overflow-y:auto; }
  .row-group{ font-size:.6rem; text-transform:uppercase; letter-spacing:.07em; color:var(--text-dim); padding:8px 12px 3px; background:var(--panel-2); position:sticky; top:0; }
  .empty-msg{ font-size:.75rem; color:var(--text-dim); font-style:italic; padding:20px 14px; text-align:center; }

  .row-card{ display:flex; align-items:center; gap:8px; padding:6px 12px 6px 9px; border-top:1px solid var(--line); border-left:3px solid var(--line); }
  .row-card.cattack{ border-left-color:var(--danger); }
  .row-card.cheal{ border-left-color:var(--heal); }
  .row-card.ctrap{ border-left-color:var(--trap); }
  .row-card.cequip{ border-left-color:var(--equip); }
  .row-card.cspecial{ border-left-color:var(--special); }
  .row-card .icon{ width:22px; text-align:center; font-size:1rem; flex:0 0 auto; }
  .row-card .info{ flex:1 1 auto; min-width:0; }
  .row-card .name{ font-weight:600; font-size:.8rem; }
  .row-card .name small{ font-weight:500; color:var(--text-dim); margin-left:6px; font-size:.68rem; }
  .row-card .pills{ display:flex; gap:4px; flex-wrap:wrap; margin:2px 0; }
  .pill-stat{ font-size:.62rem; padding:1px 6px; border-radius:999px; background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim); white-space:nowrap; }
  .row-card .fx{ font-size:.7rem; color:var(--text-dim); }
  .row-card.maxed{ opacity:.55; }

  /* pool pane: full stepper */
  .stepper{ display:flex; align-items:center; gap:2px; flex:0 0 auto; }
  .stepper button{ width:24px; height:24px; padding:0; border-radius:6px; font-size:.9rem; line-height:1; }
  .stepper b{ width:26px; text-align:center; font-size:.85rem; }

  /* deck pane: compact manifest row */
  .row-card.compact{ padding:5px 12px 5px 9px; cursor:pointer; }
  .row-card.compact:hover{ background:var(--panel-2); }
  .row-card.compact .name{ font-size:.78rem; }
  .row-card.compact .qty-ctrl{ display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .row-card.compact .qty-badge{ font-size:.78rem; font-weight:700; min-width:16px; text-align:center; }
  .row-card.compact .mini-btn{ width:22px; height:22px; padding:0; border-radius:6px; font-size:.85rem; line-height:1; }

  .deck-actions{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:0 12px; }
  .shared-status{ font-size:.68rem; color:var(--text-dim); padding:4px 12px 0; }
  .shared-status.error{ color:var(--danger); }

  /* public decks browser */
  .modal{ position:fixed; inset:0; background:rgba(8,12,18,.55); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .modal-card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);
    width:100%; max-width:720px; max-height:100%; display:flex; flex-direction:column; min-height:0;
  }
  .modal-head{ flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); }
  .modal-head input[type="search"]{
    flex:1 1 auto; min-width:0; font-family:inherit; font-size:.76rem; padding:5px 9px; border-radius:8px;
    border:1px solid var(--line); background:var(--panel-2); color:var(--text);
  }
  .modal-list{ flex:1 1 auto; min-height:0; overflow-y:auto; }
  .pub-deck{ padding:10px 12px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:6px; }
  .pub-deck:first-child{ border-top:none; }
  .pub-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .pub-name{ font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:.9rem; }
  .pub-meta{ font-size:.66rem; color:var(--text-dim); flex:1 1 auto; }
  .pub-actions{ display:flex; gap:4px; }
  .pub-cards{ display:flex; flex-wrap:wrap; gap:4px; }
  .pub-chip{ font-size:.66rem; padding:2px 7px; border-radius:999px; background:var(--panel-2); border:1px solid var(--line); border-left-width:3px; white-space:nowrap; }
  .pub-chip.cattack{ border-left-color:var(--danger); }
  .pub-chip.cheal{ border-left-color:var(--heal); }
  .pub-chip.ctrap{ border-left-color:var(--trap); }
  .pub-chip.cequip{ border-left-color:var(--equip); }
  .pub-chip.cspecial{ border-left-color:var(--special); }
  .btn.danger:hover:not(:disabled){ border-color:var(--danger); color:var(--danger); }
  .pub-error{ font-size:.68rem; color:var(--danger); white-space:pre-wrap; }
  .advanced{ flex:0 0 auto; border-top:1px solid var(--line); padding:8px 12px 12px; }
  .advanced summary{ font-size:.75rem; color:var(--text-dim); cursor:pointer; padding:4px 0; }
  .advanced-body{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .advanced textarea{ width:100%; font-size:.72rem; background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; resize:vertical; }
  .deck-text-status{ font-size:.72rem; color:var(--text-dim); white-space:pre-wrap; }
  .deck-text-status.error{ color:var(--danger); }

  @media (max-width:820px){
    html,body{ overflow-y:auto; }
    .builder{ flex-direction:column; overflow:visible; }
    .pane{ flex:0 0 auto; max-height:60vh; }
    .side-col{ flex:0 0 auto; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">fd6<small>deck builder</small></div>
    <div class="deck-tabs" role="tablist">
      <button class="btn small deck-tab" id="deckTab0" role="tab">Player 1</button>
      <button class="btn small deck-tab" id="deckTab1" role="tab">Player 2</button>
    </div>
    <span class="spacer"></span>
    <a class="btn ghost small" href="index.html">← Back to game</a>
    <button class="btn primary" id="deckApply">Apply &amp; New Game</button>
  </div>
</header>

<main class="builder">
  <section class="pane pool-pane">
    <div class="pane-head">
      <div class="pane-title">Card pool</div>
      <div class="pane-toolbar">
        <input type="search" id="deckSearch" placeholder="Search cards..." aria-label="Search cards">
        <select id="deckTypeFilter" aria-label="Filter by type">
          <option value="all">Type: All</option>
          <option value="unit">Units</option>
          <option value="trap">Traps</option>
          <option value="equip">Equips</option>
          <option value="continuous">Continuous</option>
        </select>
      </div>
    </div>
    <div class="pane-list" id="poolList"></div>
  </section>

  <div class="side-col">
    <div class="inspector" id="inspector">
      <div class="inspector-head"><span>Card Info</span></div>
      <div id="inspectorBody"><div class="inspector-empty">Hover a card to see its details.</div></div>
    </div>

    <section class="pane deck-pane">
      <div class="pane-head">
        <div class="pane-title">Your deck</div>
        <div class="deck-summary mono" id="deckSummary"><span id="deckTotal"></span><span id="deckBreakdown"></span></div>
      </div>
      <div class="deck-actions">
        <button class="btn small" id="deckCopy">Copy from other player</button>
        <button class="btn small" id="deckDefault">Reset to default</button>
        <button class="btn small" id="deckClearAll" title="Remove every card from this deck">Clear all</button>
      </div>
      <div class="deck-actions" style="padding-top:6px;">
        <button class="btn small" id="publicBrowse" title="Browse the decks in the project's decks/ folder">Browse public decks</button>
        <button class="btn small" id="deckSaveShared" title="Save this deck as a file in the project's decks/ folder" hidden>Save as public deck</button>
      </div>
      <div class="shared-status" id="sharedStatus" hidden></div>
      <div class="pane-list" id="deckList"></div>
      <details class="advanced">
        <summary>Advanced: export, import, edit as text</summary>
        <div class="advanced-body">
          <textarea id="deckTextarea" class="mono" spellcheck="false" rows="8"></textarea>
          <div class="deck-actions" style="padding:0;">
            <button class="btn small" id="deckTextApply">Apply text</button>
            <span class="deck-text-status" id="deckTextStatus"></span>
          </div>
          <div class="deck-actions" style="padding:0;">
            <button class="btn small" id="deckExport" title="Download both decks as decks.txt">Export file</button>
            <button class="btn small" id="deckImport" title="Load decks from a text file">Import file</button>
            <input type="file" id="deckFileInput" accept=".txt,text/plain" hidden>
          </div>
        </div>
      </details>
    </section>
  </div>
</main>

<div class="modal" id="publicModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="publicTitle">
    <div class="modal-head">
      <div class="pane-title" id="publicTitle">Public decks</div>
      <input type="search" id="publicSearch" placeholder="Search by deck or card name..." aria-label="Search public decks">
      <button class="btn small ghost" id="publicClose" type="button" aria-label="Close">✕</button>
    </div>
    <div class="modal-list" id="publicList"></div>
  </div>
</div>

<script src="shared.js"></script>
<script>
(function(){
  var deckRecipes = loadDeckRecipes();
  var deckEditorSide = 0;
  var searchText = '';
  var typeFilter = 'all';
  var DECK_GROUPS = [['Units', 'unit'], ['Traps', 'trap'], ['Equips', 'equip'], ['Continuous', 'continuous']];

  function deckTotal(recipe){ return Object.keys(recipe).reduce(function(a, k){ return a + recipe[k]; }, 0); }
  function matchesFilter(card){
    if (typeFilter !== 'all' && card.type !== typeFilter) return false;
    var s = searchText.trim().toLowerCase();
    if (!s) return true;
    return card.name.toLowerCase().indexOf(s) !== -1 || card.effect.toLowerCase().indexOf(s) !== -1;
  }
  function visibleKeys(){
    return Object.keys(CARD_DEFS).filter(function(key){ return matchesFilter(CARD_DEFS[key]); });
  }

  // Hovering (or focusing) a row shows it in the Card Info panel; the last card stays shown after the pointer leaves.
  function inspectCard(key){
    var card = CARD_DEFS[key];
    document.getElementById('inspector').className = 'inspector ' + cardColorClass(card);
    document.getElementById('inspectorBody').innerHTML = inspectorCardHtml(card);
  }
  function bindInspect(row, key){
    row.addEventListener('mouseenter', function(){ inspectCard(key); });
    row.addEventListener('focusin', function(){ inspectCard(key); });
  }

  function renderPool(){
    var recipe = deckRecipes[deckEditorSide];
    var keys = visibleKeys();
    var list = document.getElementById('poolList');
    list.innerHTML = '';
    DECK_GROUPS.forEach(function(g){
      var groupKeys = keys.filter(function(key){ return CARD_DEFS[key].type === g[1]; });
      if (!groupKeys.length) return;
      list.appendChild(el('div', 'row-group', {})).textContent = g[0];
      groupKeys.forEach(function(key){
        var card = CARD_DEFS[key];
        var qty = recipe[key];
        var maxed = qty >= MAX_COPIES;
        var row = el('div', 'row-card ' + cardColorClass(card) + (maxed ? ' maxed' : ''), {});
        var sub = card.type === 'unit' ? card.unitType : '';
        var lines = statLines(card).filter(Boolean);
        var pills = lines.map(function(l){ return '<span class="pill-stat mono">' + l + '</span>'; }).join('');
        row.innerHTML =
          '<div class="icon">' + card.icon + '</div>' +
          '<div class="info"><div class="name">' + card.name + (sub ? '<small>' + sub + '</small>' : '') + '</div>' +
          '<div class="pills">' + pills + '</div>' +
          '<div class="fx">' + card.effect + '</div></div>' +
          '<div class="stepper"><button class="btn" type="button" aria-label="fewer">−</button><b class="mono">' + qty + '</b><button class="btn" type="button" aria-label="more">+</button></div>';
        var btns = row.querySelectorAll('button');
        btns[0].disabled = qty <= 0;
        btns[1].disabled = maxed;
        btns[0].addEventListener('click', function(){ recipe[key] = Math.max(0, recipe[key] - 1); renderAll(); });
        btns[1].addEventListener('click', function(){ recipe[key] = Math.min(MAX_COPIES, recipe[key] + 1); renderAll(); });
        bindInspect(row, key);
        list.appendChild(row);
      });
    });
    if (!keys.length) list.appendChild(el('div', 'empty-msg', {})).textContent = 'No cards match your search.';
  }

  function renderDeckPane(){
    var recipe = deckRecipes[deckEditorSide];
    var total = deckTotal(recipe);
    document.getElementById('deckTotal').textContent = total + ' cards';
    document.getElementById('deckBreakdown').textContent = DECK_GROUPS.map(function(g){
      var n = Object.keys(recipe).reduce(function(a, k){ return a + (CARD_DEFS[k].type === g[1] ? recipe[k] : 0); }, 0);
      return g[0] + ' ' + n;
    }).join(' · ');
    document.getElementById('deckSummary').className = 'deck-summary mono' + (total < INITIAL_HAND ? ' warn' : '');
    if (total < INITIAL_HAND){
      document.getElementById('deckBreakdown').textContent += ' · needs at least ' + INITIAL_HAND + ' for the opening hand';
    }

    var list = document.getElementById('deckList');
    list.innerHTML = '';
    var any = false;
    DECK_GROUPS.forEach(function(g){
      var keys = Object.keys(CARD_DEFS).filter(function(key){ return CARD_DEFS[key].type === g[1] && recipe[key] > 0; });
      if (!keys.length) return;
      any = true;
      list.appendChild(el('div', 'row-group', {})).textContent = g[0];
      keys.forEach(function(key){
        var card = CARD_DEFS[key];
        var row = el('div', 'row-card compact ' + cardColorClass(card), { tabindex:'0', role:'button', title:'Click to remove one copy' });
        row.innerHTML =
          '<div class="icon">' + card.icon + '</div>' +
          '<div class="info"><div class="name">' + card.name + '</div></div>' +
          '<div class="qty-ctrl">' +
            '<button class="btn mini-btn" type="button" aria-label="fewer">−</button>' +
            '<span class="qty-badge mono">' + recipe[key] + '</span>' +
            '<button class="btn mini-btn" type="button" aria-label="more" ' + (recipe[key] >= MAX_COPIES ? 'disabled' : '') + '>+</button>' +
          '</div>';
        var btns = row.querySelectorAll('button');
        btns[0].addEventListener('click', function(e){ e.stopPropagation(); recipe[key] = Math.max(0, recipe[key] - 1); renderAll(); });
        btns[1].addEventListener('click', function(e){ e.stopPropagation(); recipe[key] = Math.min(MAX_COPIES, recipe[key] + 1); renderAll(); });
        row.addEventListener('click', function(){ recipe[key] = Math.max(0, recipe[key] - 1); renderAll(); });
        row.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); recipe[key] = Math.max(0, recipe[key] - 1); renderAll(); } });
        bindInspect(row, key);
        list.appendChild(row);
      });
    });
    if (!any) list.appendChild(el('div', 'empty-msg', {})).textContent = 'Your deck is empty — add cards from the pool on the left.';
  }

  function renderAll(){
    [0, 1].forEach(function(i){ document.getElementById('deckTab' + i).className = 'btn small deck-tab' + (i === deckEditorSide ? ' active' : ''); });
    document.getElementById('deckTextarea').value = decksToText(deckRecipes);
    document.getElementById('deckTextStatus').textContent = '';
    renderPool();
    renderDeckPane();
  }

  document.getElementById('deckTab0').addEventListener('click', function(){ deckEditorSide = 0; renderAll(); });
  document.getElementById('deckTab1').addEventListener('click', function(){ deckEditorSide = 1; renderAll(); });
  document.getElementById('deckSearch').addEventListener('input', function(e){ searchText = e.target.value; renderPool(); });
  document.getElementById('deckTypeFilter').addEventListener('change', function(e){ typeFilter = e.target.value; renderPool(); });

  document.getElementById('deckCopy').addEventListener('click', function(){
    deckRecipes[deckEditorSide] = JSON.parse(JSON.stringify(deckRecipes[1 - deckEditorSide]));
    renderAll();
  });
  document.getElementById('deckDefault').addEventListener('click', function(){
    deckRecipes[deckEditorSide] = defaultRecipe();
    renderAll();
  });
  document.getElementById('deckClearAll').addEventListener('click', function(){
    deckRecipes[deckEditorSide] = emptyRecipe();
    renderAll();
  });

  function applyDecksText(text, sourceLabel){
    var parsed = parseDecksText(text);
    var status = document.getElementById('deckTextStatus');
    if (parsed.errors.length){
      status.className = 'deck-text-status error';
      status.textContent = parsed.errors.join('\n');
      return false;
    }
    deckRecipes = parsed.recipes;
    renderAll();
    status.className = 'deck-text-status';
    status.textContent = 'Loaded' + (sourceLabel ? ' from ' + sourceLabel : '') + '.';
    return true;
  }
  document.getElementById('deckTextApply').addEventListener('click', function(){
    applyDecksText(document.getElementById('deckTextarea').value, '');
  });
  document.getElementById('deckExport').addEventListener('click', function(){
    var blob = new Blob([decksToText(deckRecipes)], { type: 'text/plain' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'decks.txt';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  });
  document.getElementById('deckImport').addEventListener('click', function(){ document.getElementById('deckFileInput').click(); });
  document.getElementById('deckFileInput').addEventListener('change', function(e){
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      document.getElementById('deckTextarea').value = reader.result;
      document.querySelector('.advanced').open = true;
      applyDecksText(reader.result, file.name);
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // ---------- Public decks (decks/ folder) ----------
  // Each public deck is decks/<name>.txt, listed in decks/index.json. Browsing works wherever the site is served;
  // saving needs the local server (node server.js), so the Save button only appears when it responds.
  var lastSavedName = '';
  var publicDecks = [];   // [{ file, name, recipe, errors }]
  var serverAvailable = false;   // decks/ is writable only when server.js is running; static hosting is read-only
  var publicSearch = '';

  function showSharedStatus(text, isError){
    var s = document.getElementById('sharedStatus');
    s.hidden = !text;
    s.className = 'shared-status' + (isError ? ' error' : '');
    s.textContent = text || '';
  }

  function fetchPublicDecks(){
    return fetch('decks/index.json', { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(list){
        return Promise.all(list.map(function(d){
          return fetch('decks/' + encodeURIComponent(d.file), { cache: 'no-store' })
            .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
            .then(function(text){ var p = parseDeckText(text); return { file: d.file, name: d.name, recipe: p.recipe, errors: p.errors }; })
            .catch(function(err){ return { file: d.file, name: d.name, recipe: emptyRecipe(), errors: ['Could not load: ' + err.message] }; });
        }));
      });
  }

  function deckMatchesSearch(d){
    var q = publicSearch.trim().toLowerCase();
    if (!q) return true;
    if (d.name.toLowerCase().indexOf(q) !== -1) return true;
    return Object.keys(d.recipe).some(function(k){ return d.recipe[k] > 0 && CARD_DEFS[k].name.toLowerCase().indexOf(q) !== -1; });
  }

  function renderPublicList(message){
    var list = document.getElementById('publicList');
    list.innerHTML = '';
    if (message){ list.appendChild(el('div', 'empty-msg', {})).textContent = message; return; }
    var shown = publicDecks.filter(deckMatchesSearch);
    if (!shown.length){
      list.appendChild(el('div', 'empty-msg', {})).textContent = publicDecks.length ? 'No public decks match your search.' : 'No public decks yet — build one and press "Save as public deck".';
      return;
    }
    shown.forEach(function(d){
      var total = deckTotal(d.recipe);
      var row = el('div', 'pub-deck', {});
      var head = row.appendChild(el('div', 'pub-head', {}));
      head.appendChild(el('div', 'pub-name', {})).textContent = d.name;
      head.appendChild(el('div', 'pub-meta mono', {})).textContent = total + ' cards · ' + DECK_GROUPS.map(function(g){
        return g[0] + ' ' + Object.keys(d.recipe).reduce(function(a, k){ return a + (CARD_DEFS[k].type === g[1] ? d.recipe[k] : 0); }, 0);
      }).join(' · ');
      var actions = head.appendChild(el('div', 'pub-actions', {}));
      [0, 1].forEach(function(side){
        var b = actions.appendChild(el('button', 'btn small', { type: 'button' }));
        b.textContent = 'Use for P' + (side + 1);
        b.disabled = total === 0 || d.errors.length > 0;
        b.addEventListener('click', function(){ usePublicDeck(d, side); });
      });
      if (serverAvailable){
        var del = actions.appendChild(el('button', 'btn small danger', { type: 'button', title: 'Delete decks/' + d.file + ' from the project' }));
        del.textContent = 'Delete';
        del.addEventListener('click', function(){ deletePublicDeck(d, del); });
      }
      if (d.errors.length) row.appendChild(el('div', 'pub-error', {})).textContent = d.file + ':\n' + d.errors.join('\n');
      var cards = row.appendChild(el('div', 'pub-cards', {}));
      Object.keys(CARD_DEFS).forEach(function(k){
        if (!(d.recipe[k] > 0)) return;
        var card = CARD_DEFS[k];
        var chip = cards.appendChild(el('span', 'pub-chip ' + cardColorClass(card), { title: card.effect }));
        chip.textContent = card.icon + ' ' + card.name + ' ×' + d.recipe[k];
      });
      list.appendChild(row);
    });
  }

  function usePublicDeck(d, side){
    deckRecipes[side] = JSON.parse(JSON.stringify(d.recipe));
    deckEditorSide = side;
    lastSavedName = d.name;
    closePublicDecks();
    renderAll();
    showSharedStatus('Loaded "' + d.name + '" into Player ' + (side + 1) + '.');
  }

  function deletePublicDeck(d, btn){
    if (!confirm('Delete the public deck "' + d.name + '"?\n\ndecks/' + d.file + ' will be removed from the project. This cannot be undone.')) return;
    btn.disabled = true;
    btn.textContent = 'Deleting…';
    fetch('api/decks/' + encodeURIComponent(d.file), { method: 'DELETE' })
      .then(function(r){ return r.json().then(function(body){ return { status: r.status, body: body }; }); })
      .then(function(res){
        if (res.status !== 200){
          showSharedStatus(res.body.error || 'Delete failed.', true);
          btn.disabled = false; btn.textContent = 'Delete';
          return;
        }
        publicDecks = publicDecks.filter(function(x){ return x.file !== d.file; });
        renderPublicList();
        showSharedStatus('Deleted decks/' + d.file + '.');
      })
      .catch(function(){
        showSharedStatus('Delete failed — is node server.js still running?', true);
        btn.disabled = false; btn.textContent = 'Delete';
      });
  }

  function openPublicDecks(){
    document.getElementById('publicModal').hidden = false;
    document.getElementById('publicSearch').focus();
    renderPublicList('Loading…');
    fetchPublicDecks()
      .then(function(decks){ publicDecks = decks; renderPublicList(); })
      .catch(function(){ renderPublicList('Could not reach the decks/ folder. Run "node server.js" and open http://localhost:8000/decks.html.'); });
  }
  function closePublicDecks(){ document.getElementById('publicModal').hidden = true; }
  function publicDecksOpen(){ return !document.getElementById('publicModal').hidden; }

  document.getElementById('publicBrowse').addEventListener('click', openPublicDecks);
  document.getElementById('publicClose').addEventListener('click', closePublicDecks);
  document.getElementById('publicModal').addEventListener('click', function(e){ if (e.target === e.currentTarget) closePublicDecks(); });
  document.getElementById('publicSearch').addEventListener('input', function(e){ publicSearch = e.target.value; renderPublicList(); });

  function postDeck(name, overwrite){
    return fetch('api/decks', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, text: deckToText(deckRecipes[deckEditorSide], name), overwrite: overwrite })
    }).then(function(r){ return r.json().then(function(body){ return { status: r.status, body: body }; }); });
  }
  document.getElementById('deckSaveShared').addEventListener('click', function(){
    if (deckTotal(deckRecipes[deckEditorSide]) === 0){ showSharedStatus('This deck is empty — add some cards first.', true); return; }
    var name = prompt('Name this deck:', lastSavedName);
    if (name == null || !name.trim()) return;
    name = name.trim();
    postDeck(name, false)
      .then(function(res){
        if (res.status === 409 && confirm('decks/' + res.body.file + ' already exists. Overwrite it?')) return postDeck(name, true);
        return res;
      })
      .then(function(res){
        if (!res || res.status === 409) return;
        if (res.status !== 200){ showSharedStatus(res.body.error || 'Save failed.', true); return; }
        lastSavedName = name;
        showSharedStatus('Saved as public deck decks/' + res.body.file + '.');
      })
      .catch(function(){ showSharedStatus('Save failed — is node server.js still running?', true); });
  });
  fetch('api/status', { cache: 'no-store' })
    .then(function(r){ if (r.ok){ serverAvailable = true; document.getElementById('deckSaveShared').hidden = false; } })
    .catch(function(){});

  document.getElementById('deckApply').addEventListener('click', function(){
    if (deckRecipes.some(function(r){ return deckTotal(r) < INITIAL_HAND; })){
      alert('Each deck needs at least ' + INITIAL_HAND + ' cards for the opening hand.');
      return;
    }
    saveDeckRecipes(deckRecipes);
    window.location.href = 'index.html';
  });

  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    if (publicDecksOpen()) closePublicDecks();
    else window.location.href = 'index.html';
  });

  renderAll();
})();
</script>
</body>
</html>
